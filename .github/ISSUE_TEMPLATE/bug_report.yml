name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
        For a security issue, do not use this form: see SECURITY.md.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - analytics
        - apt-server
        - asterisk
        - auth
        - backend
        - billing
        - custom-domain
        - frontend
        - internal
        - knowledge
        - mailler
        - mta-sts
        - reachy-mini-api
        - team
        - vpn-portal
        - webhooks
        - ansible collection
        - playbooks
        - documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Component version
      description: "The release tag (for example `auth-v1.2.0`) or the commit."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue? Include the exact commands or requests.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      render: shell
