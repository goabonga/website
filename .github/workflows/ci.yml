# Continuous integration and release of the monorepo. Every gate runs on pull
# requests and on pushes to main; the release job only runs on main once all
# gates are green. Nothing is published to PyPI, Debian or Ansible Galaxy:
# releases are GitHub Releases (one per bumped component) and the docs site.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The signed merge replays the commits through sign_commit.py, which refuses
  # an invalid subject; fail here, before the label is added. Pull requests
  # only: the commits of main were checked when they were merged. The deploy/
  # branches are left out: their commit is the `chore(release)` bump that
  # multicz writes, and their pull request is approved through the production
  # environment.
  commit-messages:
    name: commit-messages
    if: >-
      github.event_name == 'pull_request'
      && !startsWith(github.event.pull_request.head.ref, 'deploy/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_subject.py --range "$BASE_SHA..$HEAD_SHA"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen --only-group dev
      - name: Lint
        run: uv run --no-sync ruff check --output-format=json --output-file=ruff.json .
      - name: Summarize ruff check
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-check ruff.json
      - name: Format check
        if: ${{ !cancelled() }}
        # An explicit shell enables pipefail, so `| tee` keeps the status of the tool.
        shell: bash
        run: uv run --no-sync ruff format --check . 2>&1 | tee ruff-format.txt
      - name: Summarize ruff format
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-format ruff-format.txt

  license-headers:
    name: license-headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - name: Check SPDX headers
        shell: bash
        run: |
          {
            uv run --no-project python scripts/add_license_header.py --path apps --types py --check
            uv run --no-project python scripts/add_license_header.py --path libs --types py --check
            uv run --no-project python scripts/add_license_header.py --path scripts --types py,sh --check
            uv run --no-project python scripts/add_license_header.py --path .github --types yml --check
            uv run --no-project python scripts/add_license_header.py --path . --types toml --check
          } 2>&1 | tee headers.txt
      - name: Summarize license headers
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py headers headers.txt

  multicz:
    name: multicz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # NOTE: no python-version pin here - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uvx multicz validate --strict

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uv sync --frozen --only-group doc
      - run: uv run --no-sync zensical build --clean

  ansible:
    name: ansible
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.collections
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uv sync --frozen --only-group dev
      - name: Install the collection from ./ansible
        run: uv run --no-sync ansible-galaxy collection install ./ansible -p .collections
      - name: Syntax-check the playbooks
        run: |
          for playbook in bootstrap site apps; do
            uv run --no-sync ansible-playbook --syntax-check -i localhost, "goabonga.website.${playbook}"
          done
      - name: Argument-spec smoke test
        run: |
          for dir in ansible/roles/*/; do
            role="$(basename "$dir")"
            uv run --no-sync ansible-doc -t role --json "goabonga.website.${role}" 2>/dev/null \
              | python3 -c "import json, sys; d = json.load(sys.stdin)['goabonga.website.${role}']; assert d['entry_points']['main']['options'] is not None" \
              || { echo "::error::argument spec missing or invalid for role ${role}"; exit 1; }
          done

  # Selects what the per-application and per-library jobs have to run. An
  # application is tested when multicz reports its component as changed since
  # the base of the pull request (or the previous tip of main); a change to
  # anything shared (lock file, root configuration, libraries, this workflow)
  # selects everything. The release commits of multicz select nothing.
  detect:
    name: detect
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_apps: ${{ steps.select.outputs.has_apps }}
      libs: ${{ steps.select.outputs.libs }}
      has_libs: ${{ steps.select.outputs.has_libs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # NOTE: no python-version pin here - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Select the applications and the libraries
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          ALL_PATTERN: ^(uv\.lock|pyproject\.toml|libs/|\.github/workflows/ci\.yml|\.github/actions/)
        run: |
          set -euo pipefail
          all_apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          all_libs=$(find libs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort || true)

          if [ "$EVENT" = "pull_request" ]; then
            since="origin/${BASE_REF}"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            since="$BEFORE"
          else
            since=""
          fi

          if [ "$EVENT" = "push" ] && [[ "$(git log -1 --format=%s)" == "chore(release):"* ]]; then
            apps=""; libs=""
          elif [ -z "$since" ] || git diff --name-only "$since" HEAD | grep -Eq "$ALL_PATTERN"; then
            apps="$all_apps"; libs="$all_libs"
          else
            changed=$(uv tool run multicz changed --since "$since" --output json | jq -r '.changed[]')
            apps=$(comm -12 <(echo "$all_apps") <(echo "$changed" | sort))
            libs=$(git diff --name-only "$since" HEAD | sed -n 's|^libs/\([^/]*\)/.*|\1|p' | sort -u)
          fi

          to_json() { jq -R -s -c --arg key "$1" '{($key): (split("\n") | map(select(. != "")))}'; }
          matrix=$(printf '%s\n' "$apps" | to_json app)
          libs_json=$(printf '%s\n' "$libs" | to_json lib)
          {
            echo "matrix=${matrix}"
            echo "libs=${libs_json}"
            echo "has_apps=$([ -n "$apps" ] && echo true || echo false)"
            echo "has_libs=$([ -n "$libs" ] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.app }})
    needs: [detect]
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.app }}
          python-version: "3.11"
      # Browser scenarios (tagged @browser) need Chromium; applications without any
      # skip the download and the system packages.
      - name: Detect browser scenarios
        id: browser
        run: |
          if grep -rqs --include='*.feature' '@browser' "apps/${{ matrix.app }}/features"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the dependencies
        if: steps.browser.outputs.needed == 'true'
        run: uv sync --frozen --package "${{ matrix.app }}" --group dev
      - name: Cache the Playwright browsers
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install the browser
        if: steps.browser.outputs.needed == 'true'
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Run pytest with coverage
        run: |
          uv run --frozen --package "${{ matrix.app }}" --group dev pytest "apps/${{ matrix.app }}" \
            --cov="apps/${{ matrix.app }}/src" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy
      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pytest --junit junit.xml --coverage coverage.xml
      - name: Run behave scenarios
        run: uv run --frozen --package "${{ matrix.app }}" --group dev behave "apps/${{ matrix.app }}/features"
      - name: Upload the artifacts of failed browser scenarios
        if: ${{ failure() && steps.browser.outputs.needed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts-${{ matrix.app }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: ${{ matrix.app }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: junit.xml
          flags: ${{ matrix.app }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true

  libs:
    name: libs (${{ matrix.lib }})
    needs: [detect]
    if: needs.detect.outputs.has_libs == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.libs) }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.lib }}
          python-version: "3.11"
      - run: uv sync --frozen --package "${{ matrix.lib }}" --group dev
      # The browser tests of the libraries launch Chromium.
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest "libs/${{ matrix.lib }}"

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync pytest scripts/tests

  bandit:
    name: bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - name: Run Bandit
        run: uvx --from 'bandit[toml]' bandit -c pyproject.toml --recursive apps/*/src --format json --output bandit.json
      - name: Summarize bandit
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py bandit bandit.json

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen --all-packages
      - name: Run pip-audit
        shell: bash
        # --path takes the site-packages directory, not the environment: given
        # .venv it audits nothing and exits 0. The two ignored advisories have no
        # fixed release; they are accepted, with their reasons and a review date,
        # in osv-scanner.toml.
        run: |
          uvx pip-audit --skip-editable \
            --path "$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-4298 2>&1 | tee pip-audit.txt
      - name: Summarize pip-audit
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text pip-audit pip-audit.txt

  # The binary is pinned to a release and verified against its published
  # checksum instead of downloading whatever `latest` points to.
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: v2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@v6
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          echo "${OSV_SCANNER_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum --check
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run OSV-Scanner
        shell: bash
        run: osv-scanner scan source --lockfile=uv.lock 2>&1 | tee osv-scanner.txt
      - name: Summarize osv-scanner
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text osv-scanner osv-scanner.txt

  release:
    name: release
    needs: [lint, license-headers, multicz, docs, ansible, test, libs, scripts, bandit, pip-audit, osv-scanner]
    # test and libs are skipped when nothing they cover changed: a skipped gate
    # does not block the release, a failed one does.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      # Space-separated "<component>=<version>" pairs, one per bumped component.
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      # The bump commit and the tags are pushed with RELEASE_PAT: a push made
      # with the default token starts no workflow and cannot pass the ruleset.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || github.token }}
      # NOTE: no python-version pin here - multicz needs Python >=3.12 and
      # `uv tool install multicz` fails under 3.11.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        env:
          NAME: ${{ github.event.head_commit.author.name }}
          EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      # Components named deploy-* record what is deployed to an environment:
      # only the deploy workflows bump them, after a successful apply.
      - name: Select the releasable components
        id: components
        run: |
          set -euo pipefail
          ARGS=$(uv tool run multicz config --output json \
            | jq -r '.components | keys[] | select(startswith("deploy-") | not) | "--component " + .' \
            | tr '\n' ' ')
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
      - name: Plan release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag, push (signed)
        id: bump_signed
        if: steps.gpg.outputs.available == 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump ${{ steps.components.outputs.args }} --commit --tag --push --sign --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | to_entries | map("\(.key)=\(.value.next_version)") | join(" ")')
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
      - name: Bump, commit, tag, push
        id: bump_unsigned
        if: steps.gpg.outputs.available != 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump ${{ steps.components.outputs.args }} --commit --tag --push --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | to_entries | map("\(.key)=\(.value.next_version)") | join(" ")')
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
      - name: Resolve release outputs
        id: bump
        env:
          BUMPED: ${{ steps.bump_signed.outputs.bumped || steps.bump_unsigned.outputs.bumped }}
        run: |
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
          if [ -z "${BUMPED}" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
          fi

  github-release:
    name: github-release
    needs: [release]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      # NOTE: no python-version pin here - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Create a GitHub release per bumped component
        env:
          # A release created with the default token starts no workflow.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          BUMPED: ${{ needs.release.outputs.bumped }}
        run: |
          set -euo pipefail
          for pair in ${BUMPED}; do
            component="${pair%%=*}"
            version="${pair#*=}"
            # The SAME tag multicz created: every component uses
            # "<component>-v{version}".
            tag="${component}-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release ${tag} already exists, skipping"
              continue
            fi
            notes=$(uv tool run multicz release-notes --tag "$tag")
            assets=()
            if [ "$component" = "ansible" ]; then
              # Attach the collection tarball built from the tagged sources.
              git checkout --detach "$tag"
              uvx --from ansible-core ansible-galaxy collection build ansible --output-path dist
              git checkout --detach main
              assets=(dist/*.tar.gz)
            fi
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag "${assets[@]}"
          done

  docs-deploy:
    name: docs-deploy
    needs: [release, github-release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.github-release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        run: uv run --no-sync zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
