# Continuous integration and release of the monorepo, built around what multicz reports as changed.
#
#   detect -> checks (matrix: component x check) -> unit (matrix: component) -> behave (matrix: component)
#   ci-pass (every job) -> release-bump -> release-<component>, docs-deploy
#
# `detect` asks multicz which components changed since the base of the pull request (or the previous
# tip of main) and publishes them as JSON. multicz owns the dependencies: a change to `ansible` selects
# the playbooks and `deploy-production`, a change to `e2e-support` selects the applications that use it.
# scripts/ci_matrix.py turns the selection into the three matrices: the checks of each selected
# component (license headers, lint, format, bandit, pip-audit and osv-scanner), its unit tests, and its
# behave scenarios. A matrix with nothing to run is skipped. The tests wait for the checks and the
# scenarios wait for the tests, so nothing runs tests on code that fails a check.
#
# `detect` also names four groups multicz does not know, by the files that changed: `docs`, `scripts`,
# `workflows` (.github) and `workspace` (the toml files of the root), plus `collection` when the Ansible
# collection or a playbook changed. detect has to be in the `needs` of the job that reads its outputs:
# GitHub exposes the outputs of direct dependencies only.
#
# The release only runs on main once ci-pass is green. `release-bump` bumps every releasable component in
# one commit with one tag per component; each `release-<name>` job runs only when its component was
# bumped and creates its GitHub release. Nothing is published to PyPI, Debian or Ansible Galaxy.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The signed merge replays the commits through sign_commit.py, which refuses
  # an invalid subject; fail here, before the label is added. Pull requests
  # only: the commits of main were checked when they were merged. The deploy/
  # branches are left out: their commit is the `chore(release)` bump that
  # multicz writes, and their pull request is approved through the production
  # environment.
  commit-messages:
    name: commit-messages
    if: >-
      github.event_name == 'pull_request'
      && !startsWith(github.event.pull_request.head.ref, 'deploy/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: python3 scripts/check_commit_subject.py --range "$BASE_SHA..$HEAD_SHA" 2>&1 | tee commit-messages.txt
      - name: Summarize commit-messages
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text commit-messages commit-messages.txt


  multicz:
    name: multicz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # NOTE: no python-version pin here - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Validate the multicz configuration
        shell: bash
        run: uvx multicz validate --strict --output json | tee multicz.json
      - name: Summarize multicz
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py multicz multicz.json

  # Selects what the jobs have to run, and builds their matrices. multicz reports the components that changed since the base of the
  # pull request (or the previous tip of main), with their dependents; a change to anything shared (lock
  # file, root pyproject, this workflow, the local actions) selects everything. The release commits of
  # multicz select nothing.
  detect:
    name: detect
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      checks: ${{ steps.select.outputs.checks }}
      has_checks: ${{ steps.select.outputs.has_checks }}
      tests: ${{ steps.select.outputs.tests }}
      has_tests: ${{ steps.select.outputs.has_tests }}
      behave: ${{ steps.select.outputs.behave }}
      has_behave: ${{ steps.select.outputs.has_behave }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # NOTE: no python-version pin here - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Select the changed components
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          ALL_PATTERN: ^(uv\.lock|pyproject\.toml|\.github/workflows/ci\.yml|\.github/actions/)
        run: |
          set -euo pipefail
          all_components=$(uv tool run multicz config --output json | jq -r '.components | keys[]')
          all_groups=$(printf '%s\n' docs scripts workflows workspace collection)
          to_array() { jq -R -s -c 'split("\n") | map(select(. != ""))'; }

          if [ "$EVENT" = "pull_request" ]; then
            since="origin/${BASE_REF}"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            since="$BEFORE"
          else
            since=""
          fi

          if [ "$EVENT" = "push" ] && [[ "$(git log -1 --format=%s)" == "chore(release):"* ]]; then
            names='[]'
            reason="The release commit of multicz selects nothing: what it contains was tested before"
          elif [ -z "$since" ]; then
            names=$(printf '%s\n%s\n' "$all_components" "$all_groups" | to_array)
            reason="There is nothing to compare with, so everything is selected"
          elif git diff --name-only "$since" HEAD | grep -Eq "$ALL_PATTERN"; then
            names=$(printf '%s\n%s\n' "$all_components" "$all_groups" | to_array)
            reason="A shared file changed (uv.lock, the root pyproject, ci.yml or a local action), so everything is selected"
          else
            reason="multicz changed, with the components that depend on them, and the groups of files that changed"
            files=$(git diff --name-only "$since" HEAD)
            components=$(uv tool run multicz changed --since "$since" --output json | jq -c '.changed')
            groups=$(
              {
                grep -Eq '^(docs/|zensical\.toml|assets/)' <<< "$files" && echo docs
                grep -Eq '^scripts/' <<< "$files" && echo scripts
                grep -Eq '^\.github/' <<< "$files" && echo workflows
                grep -Eq '^[^/]+\.toml$' <<< "$files" && echo workspace
                jq -e 'any(.[]; . == "ansible" or startswith("playbook-"))' <<< "$components" > /dev/null && echo collection
                true
              } | to_array
            )
            names=$(jq -c -n --argjson a "$components" --argjson b "$groups" '$a + $b')
          fi

          changed=$(jq -c -n --argjson names "$names" '{changed: $names}')
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          all=$(printf '%s\n%s\n' "$all_components" "$all_groups" | to_array)
          jq -n --argjson changed "$names" --argjson all "$all" --arg reason "$reason" --arg since "$since" \
            '{changed: $changed, all: $all, reason: $reason, since: $since}' > changed.json
          python3 scripts/format_summary.py changed changed.json
          printf '%s' "$changed" | python3 scripts/ci_matrix.py >> "$GITHUB_OUTPUT"

  checks:
    name: checks (${{ matrix.target }}, ${{ matrix.check }})
    needs: [detect]
    if: needs.detect.outputs.has_checks == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.checks) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/app-check
        with:
          check: ${{ matrix.check }}
          path: ${{ matrix.path }}
          package: ${{ matrix.package }}
          types: ${{ matrix.types }}

  ansible:
    name: ansible (${{ matrix.check }})
    needs: [detect]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'collection')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [syntax, argspec]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ansible-check
        with:
          check: ${{ matrix.check }}

  docs-build:
    name: docs-build
    needs: [detect]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uv sync --frozen --only-group doc
      - name: Build the site
        shell: bash
        run: uv run --no-sync zensical build --clean 2>&1 | tee docs.txt
      - name: Summarize docs-build
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text docs-build docs.txt

  unit:
    name: unit (${{ matrix.target }})
    needs: [detect, checks]
    # A skipped matrix (nothing selected) does not stop the tests, a failed check does.
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.has_tests == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.tests) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/app-check
        with:
          check: test
          path: ${{ matrix.path }}
          package: ${{ matrix.package }}
          browser: ${{ matrix.browser }}
          codecov-token: ${{ matrix.codecov == 'true' && secrets.CODECOV_TOKEN || '' }}

  behave:
    name: behave (${{ matrix.target }})
    needs: [detect, unit]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.has_behave == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.behave) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/app-check
        with:
          check: behave
          path: ${{ matrix.path }}
          package: ${{ matrix.package }}

  # The one check to require: it fails when any job failed or was cancelled, and passes when the others
  # were skipped because nothing they cover changed.
  ci-pass:
    name: ci-pass
    needs: [detect, commit-messages, multicz, checks, ansible, docs-build, unit, behave]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort > results.txt
          cut -f1 results.txt | uniq -c | sed 's/^ *//' | tee -a results.txt > /dev/null
          if grep -Eq '^(failure|cancelled)	' results.txt; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
      - name: Summarize ci-pass
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text ci-pass results.txt

  release-bump:
    name: release-bump
    needs: [ci-pass]
    if: >-
      !cancelled() && needs.ci-pass.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      # Space-separated "<component>=<version>" pairs, one per bumped component.
      bumped: ${{ steps.bump.outputs.bumped }}
      # The version of each component, empty when it was not bumped.
      analytics_version: ${{ steps.bump.outputs.analytics_version }}
      apt_server_version: ${{ steps.bump.outputs.apt_server_version }}
      asterisk_version: ${{ steps.bump.outputs.asterisk_version }}
      auth_version: ${{ steps.bump.outputs.auth_version }}
      backend_version: ${{ steps.bump.outputs.backend_version }}
      billing_version: ${{ steps.bump.outputs.billing_version }}
      custom_domain_version: ${{ steps.bump.outputs.custom_domain_version }}
      frontend_version: ${{ steps.bump.outputs.frontend_version }}
      internal_version: ${{ steps.bump.outputs.internal_version }}
      knowledge_version: ${{ steps.bump.outputs.knowledge_version }}
      mailler_version: ${{ steps.bump.outputs.mailler_version }}
      mta_sts_version: ${{ steps.bump.outputs.mta_sts_version }}
      reachy_mini_api_version: ${{ steps.bump.outputs.reachy_mini_api_version }}
      team_version: ${{ steps.bump.outputs.team_version }}
      vpn_portal_version: ${{ steps.bump.outputs.vpn_portal_version }}
      webhooks_version: ${{ steps.bump.outputs.webhooks_version }}
      ansible_version: ${{ steps.bump.outputs.ansible_version }}
      playbook_bootstrap_version: ${{ steps.bump.outputs.playbook_bootstrap_version }}
      playbook_site_version: ${{ steps.bump.outputs.playbook_site_version }}
      playbook_apps_version: ${{ steps.bump.outputs.playbook_apps_version }}
    steps:
      # The bump commit and the tags are pushed with RELEASE_PAT: a push made
      # with the default token starts no workflow and cannot pass the ruleset.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || github.token }}
      # NOTE: no python-version pin here - multicz needs Python >=3.12 and
      # `uv tool install multicz` fails under 3.11.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        env:
          NAME: ${{ github.event.head_commit.author.name }}
          EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      # Components named deploy-* record what is deployed to an environment:
      # only the deploy workflows bump them, after a successful apply.
      - name: Select the releasable components
        id: components
        run: |
          set -euo pipefail
          ARGS=$(uv tool run multicz config --output json \
            | jq -r '.components | keys[] | select((startswith("deploy-") or . == "e2e-support") | not) | "--component " + .' \
            | tr '\n' ' ')
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
      - name: Plan release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag, push (signed)
        id: bump_signed
        if: steps.gpg.outputs.available == 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump ${{ steps.components.outputs.args }} --commit --tag --push --sign --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | to_entries | map("\(.key)=\(.value.next_version)") | join(" ")')
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
          for pair in ${BUMPED}; do
            component="${pair%%=*}"
            echo "${component//-/_}_version=${pair#*=}" >> "$GITHUB_OUTPUT"
          done
      - name: Bump, commit, tag, push
        id: bump_unsigned
        if: steps.gpg.outputs.available != 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump ${{ steps.components.outputs.args }} --commit --tag --push --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | to_entries | map("\(.key)=\(.value.next_version)") | join(" ")')
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
      - name: Resolve release outputs
        id: bump
        env:
          BUMPED: ${{ steps.bump_signed.outputs.bumped || steps.bump_unsigned.outputs.bumped }}
        run: |
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
          if [ -z "${BUMPED}" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize the release
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          printf '%s\n' "${BUMPED:-nothing was bumped}" | tr ' ' '\n' > bumped.txt
          python3 scripts/format_summary.py text release-bump bumped.txt

  release-analytics:
    name: release-analytics
    needs: [release-bump]
    if: needs.release-bump.outputs.analytics_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: analytics
          version: ${{ needs.release-bump.outputs.analytics_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-apt-server:
    name: release-apt-server
    needs: [release-bump]
    if: needs.release-bump.outputs.apt_server_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: apt-server
          version: ${{ needs.release-bump.outputs.apt_server_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-asterisk:
    name: release-asterisk
    needs: [release-bump]
    if: needs.release-bump.outputs.asterisk_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: asterisk
          version: ${{ needs.release-bump.outputs.asterisk_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-auth:
    name: release-auth
    needs: [release-bump]
    if: needs.release-bump.outputs.auth_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: auth
          version: ${{ needs.release-bump.outputs.auth_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-backend:
    name: release-backend
    needs: [release-bump]
    if: needs.release-bump.outputs.backend_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: backend
          version: ${{ needs.release-bump.outputs.backend_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-billing:
    name: release-billing
    needs: [release-bump]
    if: needs.release-bump.outputs.billing_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: billing
          version: ${{ needs.release-bump.outputs.billing_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-custom-domain:
    name: release-custom-domain
    needs: [release-bump]
    if: needs.release-bump.outputs.custom_domain_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: custom-domain
          version: ${{ needs.release-bump.outputs.custom_domain_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-frontend:
    name: release-frontend
    needs: [release-bump]
    if: needs.release-bump.outputs.frontend_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: frontend
          version: ${{ needs.release-bump.outputs.frontend_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-internal:
    name: release-internal
    needs: [release-bump]
    if: needs.release-bump.outputs.internal_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: internal
          version: ${{ needs.release-bump.outputs.internal_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-knowledge:
    name: release-knowledge
    needs: [release-bump]
    if: needs.release-bump.outputs.knowledge_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: knowledge
          version: ${{ needs.release-bump.outputs.knowledge_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-mailler:
    name: release-mailler
    needs: [release-bump]
    if: needs.release-bump.outputs.mailler_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: mailler
          version: ${{ needs.release-bump.outputs.mailler_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-mta-sts:
    name: release-mta-sts
    needs: [release-bump]
    if: needs.release-bump.outputs.mta_sts_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: mta-sts
          version: ${{ needs.release-bump.outputs.mta_sts_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  release-reachy-mini-api:
    name: release-reachy-mini-api
    needs: [release-bump]
    if: needs.release-bump.outputs.reachy_mini_api_version != ''
