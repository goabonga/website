          ref: main
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/publish-release
        with:
          component: playbook-apps
          version: ${{ needs.release-bump.outputs.playbook_apps_version }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

  docs-deploy:
    name: docs-deploy
    needs: [release-bump]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release-bump.result == 'success'
      && needs.release-bump.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        shell: bash
        run: uv run --no-sync zensical build --clean 2>&1 | tee docs.txt
      - name: Summarize docs-deploy
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text docs-deploy docs.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
