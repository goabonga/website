name: dependabot-rewrite

# `pull_request_target` so the workflow can read GPG_PRIVATE_KEY /
# GPG_PASSPHRASE (regular `pull_request` runs without secrets on bot events).
# The workflow body is loaded from `main`, not the PR branch, and so is the
# rewrite script: it is run from a trusted checkout of the default branch
# while the signing key is imported, and the pull request branch is only data
# to rewrite. The pull request author gate restricts the job to genuine
# Dependabot pull requests, which stays true when someone else re-runs it.
#
# The rewritten branch is pushed with AUTO_MERGE_PAT: a push made with the
# workflow token starts no workflow, so ci would never run on the rewritten
# head and dependabot-auto-merge would never queue it. That push starts this
# workflow again; only a head commit still authored by Dependabot is
# rewritten, which ends the loop.

on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write # force-push the rewritten branch when AUTO_MERGE_PAT is unset
  pull-requests: write # retitle the pull request after its commits
  issues: write # track the pull request with an issue

jobs:
  rewrite:
    name: rewrite dependabot commits
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-rewrite-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Decide whether the branch needs rewriting
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          AUTHOR=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "The head commit is no longer authored by Dependabot: already rewritten."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "GPG_PRIVATE_KEY and/or GPG_PASSPHRASE are not configured. "
              echo "The Dependabot PR ships with bot-authored, web-signed commits."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GPG secrets unset; leaving Dependabot commits as-is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR head branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: pr
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Split a grouped lock update per dependency
        # Runs before the signing key is imported. A group that only touches
        # uv.lock is regenerated one dependency at a time, so each gets its
        # own type and scope; anything else stays a single commit.
        id: split
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" HEAD)
          COUNT=$(python3 "$GITHUB_WORKSPACE/trusted/scripts/split_dependabot_lock.py" \
            prepare "$BASE_SHA" "$RUNNER_TEMP/split")
          if [ "$COUNT" -gt 1 ]; then
            echo "split=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GPG and git identity from the imported key
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          UID_LINE=$(gpg --list-keys --with-colons "$KEY_ID" | awk -F: '/^uid/{print $10; exit}')
          NAME="${UID_LINE%% <*}"
          EMAIL=$(printf '%s' "$UID_LINE" | sed -nE 's/.*<([^>]+)>.*/\1/p')
          git config user.name  "$NAME"
          git config user.email "$EMAIL"
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config core.hooksPath /dev/null

      - name: Rewrite commits with scope-aware messages
        if: steps.gate.outputs.skip != 'true' && steps.split.outputs.split != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" HEAD)
          # The script comes from the trusted checkout, never from the branch
          # it rewrites; it reads the pyproject files of the branch as data.
          git rebase "$BASE_SHA" \
            --exec "python3 $GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py"

      - name: Commit one dependency per commit
        if: steps.gate.outputs.skip != 'true' && steps.split.outputs.split == 'true'
        working-directory: pr
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/split_dependabot_lock.py" \
            commit "$RUNNER_TEMP/split"

      - name: Force-push rewritten branch
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push --force-with-lease origin "HEAD:${HEAD_REF}"

      - name: Retitle the pull request after its commits
        # The title Dependabot chose carries its own type and no scope, which
        # the rewrite changed on the commits. The title goes through the REST
        # API: `gh pr edit` needs a token scope the workflow token lacks.
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          TITLE=$(python3 "$GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py" \
            title "origin/${BASE_REF}..HEAD")
          if [ "$TITLE" != "$PR_TITLE" ]; then
            gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --method PATCH --field title="$TITLE"
          fi

      - name: Track the pull request with an issue
        # The issue is assigned to the repository owner and closed with the
        # pull request: `Closes #N` in its description covers a merge through
        # the interface, the close-issue job covers the rest.
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/dependabot_issue.py" link

      - name: Write step summary
        if: steps.gate.outputs.skip != 'true' && success()
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          {
            echo "## Dependabot rewrite: applied"
            echo ""
            echo "PR branch \`${HEAD_REF}\` rewritten:"
            echo ""
            echo "- Conventional-commits type and scope inferred from the declaring app and dev-group membership"
            echo "- A group that only touches uv.lock is split into one commit per dependency"
            echo "- The pull request title follows the rewritten commits"
            echo "- The pull request is tracked by an issue closed with it"
            echo "- Authored and GPG-signed as \`$(git config user.name) <$(git config user.email)>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  close-issue:
    name: close the linked issue
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Close the issue of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: python3 scripts/dependabot_issue.py close
