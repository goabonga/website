# Applications deployed by apps.yml. See the "Deploying applications" page for
# the catalog of components and the override rules.

website_apps_enabled:
  - frontend
  - backend
  - analytics
  - auth

# Source of the applications: the monorepo, deployed from Git.
website_repo_url: "https://github.com/goabonga/website.git"
website_repo_version: main
# Only for a private repository.
website_repo_token: "{{ vault_website_repo_token | default('') }}"

# OAuth2 clients registered on the authentication server, per application.
website_oauth2_clients:
  frontend:
    client_id: "{{ vault_frontend_oauth2_client_id }}"
  backend:
    client_id: "{{ vault_backend_oauth2_client_id }}"
    swagger_client_id: "{{ vault_backend_oauth2_swagger_client_id }}"
  analytics:
    client_id: "{{ vault_analytics_oauth2_client_id }}"
    swagger_client_id: "{{ vault_analytics_oauth2_swagger_client_id }}"

# Adjustments of the catalog, keyed by component. Dictionaries are merged
# recursively, lists are replaced.
website_apps_overrides:
  # Pin an application to one of its releases.
  backend:
    version: backend-v1.0.0
    env_vars:
      OPENAI_MODEL: gpt-4o-mini
  # Mail goes through SMTP instead of the mailler application.
  auth:
    env_vars:
      EMAIL_BACKEND: smtp
    secret_names: [JWKS_ENCRYPTION_KEY]
    optional_secret_names: [SMTP_PASSWORD]
  auth_worker:
    secret_names: [JWKS_ENCRYPTION_KEY]
    optional_secret_names: [SMTP_PASSWORD]
  auth_beat:
    enabled: false

# Secrets, stored as encrypted systemd credentials. Application-level entries
# are shared by the components that declare the name; component-level entries
# win. The values live in the vault.
website_secrets:
  auth:
    JWKS_ENCRYPTION_KEY: "{{ vault_auth_jwks_encryption_key }}"
    SMTP_PASSWORD: "{{ vault_smtp_password | default('') }}"
  backend:
    OPENAI_API_KEY: "{{ vault_openai_api_key }}"
    OAUTH2_CLIENT_SECRET: "{{ vault_backend_oauth2_client_secret }}"
  analytics:
    OAUTH2_CLIENT_SECRET: "{{ vault_analytics_oauth2_client_secret }}"

# Clients of the shared services (custom_domain, mailler, billing) are
# registered after the migrations of each service. See the "Onboarding a SaaS
# application" page. For example, to add knowledge, which is a client of the
# three services: add `knowledge` before `mailler` to website_apps_enabled (its
# templates are imported with its own Python), register its OAuth client
# and put its secrets in the vault:
#
# website_oauth2_clients:
#   knowledge:
#     client_id: "{{ vault_knowledge_oauth2_client_id }}"
#
# website_secrets:
#   knowledge:
#     OPENAI_API_KEY: "{{ vault_openai_api_key }}"
#     OAUTH2_CLIENT_SECRET: "{{ vault_knowledge_oauth2_client_secret }}"
#     # Sign the webhooks of billing and custom_domain; the same values are
#     # registered in the other services below.
#     BILLING_WEBHOOK_SECRET: "{{ vault_knowledge_billing_webhook_secret }}"
#     CUSTOM_DOMAIN_WEBHOOK_SECRET: "{{ vault_knowledge_custom_domain_webhook_secret }}"
#
# website_mailler_clients:
#   - client_id: "{{ website_oauth2_clients.knowledge.client_id }}"
#     name: Knowledge
#     from_email: no-reply@knowledge.example.com
#     allowed_providers: [brevo]
#     default_provider: brevo
#
# website_mailler_template_dirs:
#   - client_id: "{{ website_oauth2_clients.knowledge.client_id }}"
#     app: knowledge
#     module: knowledge.email_templates
#
# website_custom_domain_clients:
#   - client_id: "{{ website_oauth2_clients.knowledge.client_id }}"
#     name: Knowledge
#     upstream: /run/knowledge/knowledge.sock
#     cname: apps.example.com
#     webhook_url: https://knowledge.example.com/webhooks/custom-domain
#     webhook_secret: "{{ vault_knowledge_custom_domain_webhook_secret }}"
#
# website_billing_saas_apps:
#   - slug: knowledge
#     name: Knowledge
#     checkout_urls: [https://knowledge.example.com/]
#     webhook_url: https://knowledge.example.com/webhooks/billing
#
# website_billing_client_bindings:
#   - saas: knowledge
#     client_id: "{{ website_oauth2_clients.knowledge.client_id }}"
#
# Then the settings of knowledge itself. The identifier of the SaaS application
# comes from `billing-admin saas list` once billing has created it (second run);
# the webhook secret of the application is set in the internal interface.
#
# website_knowledge_billing_app_slug: knowledge
# website_knowledge_billing_saas_id: "{{ vault_knowledge_billing_saas_id }}"
# website_knowledge_billing_checkout_success_url: https://knowledge.example.com/checkout/success
# website_knowledge_billing_checkout_cancel_url: https://knowledge.example.com/checkout/cancel
# website_knowledge_quota_fallback_limits:
#   free: {max_collections: 1}
#   "*": {max_collections: 0}
# website_knowledge_operator_name: Example Corp
# website_knowledge_contact_email: contact@example.com
# website_knowledge_legal_email: legal@example.com
# website_knowledge_privacy_email: privacy@example.com
# website_knowledge_support_url: https://example.com/support
#
# internal asks billing and mailler for their admin scopes, which follow
# website_billing_partition_admin_scope and website_mailler_admin_scope. Its
# OAuth client must hold them (and register it as a mailler client if it uses
# campaigns); see the python_app page for the other settings.
