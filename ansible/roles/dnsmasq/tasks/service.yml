- name: Manage the dnsmasq service
  ansible.builtin.systemd:
    name: "{{ dnsmasq_service_name }}"
    state: "{{ dnsmasq_service_state }}"
    enabled: "{{ dnsmasq_service_enabled }}"
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers
