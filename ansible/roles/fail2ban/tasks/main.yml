- name: Install fail2ban
  ansible.builtin.import_tasks: install.yml
  when: fail2ban_enabled | bool
  tags: [fail2ban]

- name: Configure fail2ban
  ansible.builtin.import_tasks: configure.yml
  when: fail2ban_enabled | bool
  tags: [fail2ban]

- name: Start fail2ban
  ansible.builtin.import_tasks: service.yml
  when: fail2ban_enabled | bool
  tags: [fail2ban]
