- name: Update the GeoIP databases
  ansible.builtin.command:
    cmd: "{{ geoip_update_command }}"
  changed_when: true
  when:
    - geoip_update_on_config_change | bool
    - geoip_initial_download_result is not changed
  listen: geoip | update databases
