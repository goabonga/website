- name: Reload nginx
  ansible.builtin.systemd:
    name: "{{ nginx_service_name }}"
    state: reloaded
  when: nginx_service_state == 'started'
  listen: nginx | reload

- name: Restart nginx
  ansible.builtin.systemd:
    name: "{{ nginx_service_name }}"
    state: restarted
  when: nginx_service_state == 'started'
  listen: nginx | restart
