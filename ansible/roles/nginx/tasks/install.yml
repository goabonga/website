- name: Assert the target is a Debian-family system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: The nginx role only supports Debian-family distributions.
    quiet: true

- name: Check the host name settings
  ansible.builtin.assert:
    that:
      - nginx_hostname | length > 0 or not (nginx_redirect_ip_to_hostname | bool)
      - >-
        not (nginx_https_enabled | bool and nginx_hostname | length > 0)
        or (nginx_certbot_agree_tos | bool and nginx_certbot_email | length > 0)
    fail_msg: >-
      nginx_redirect_ip_to_hostname needs nginx_hostname, and nginx_https_enabled needs
      nginx_certbot_agree_tos: true and nginx_certbot_email.
    quiet: true

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present
    update_cache: "{{ nginx_apt_update_cache }}"
    cache_valid_time: "{{ nginx_apt_cache_valid_time }}"
