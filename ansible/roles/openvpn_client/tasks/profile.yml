- name: Deploy the client profile
  when: openvpn_client_config_file | length > 0
  block:
    - name: Read the client profile
      ansible.builtin.slurp:
        src: "{{ openvpn_client_config_file }}"
      delegate_to: localhost
      become: false
      register: openvpn_client_profile
      no_log: true

    - name: Install the client profile
      ansible.builtin.template:
        src: client.conf.j2
        dest: "{{ openvpn_client_config_dir }}/{{ openvpn_client_config_name }}.conf"
        owner: root
        group: root
        mode: "0600"
      diff: false
      notify: openvpn_client | restart
