- name: Look for the GPG key used by pass
  ansible.builtin.command:
    cmd: "gpg --list-keys {{ protonmail_bridge_gpg_key_email | quote }}"
  become: true
  become_user: "{{ protonmail_bridge_user }}"
  environment:
    HOME: "{{ protonmail_bridge_home }}"
    GNUPGHOME: "{{ protonmail_bridge_home }}/.gnupg"
  register: protonmail_bridge_gpg_key
  changed_when: false
  failed_when: false
  check_mode: false
  when: protonmail_bridge_manage_gpg | bool

- name: Generate the GPG key used by pass
  ansible.builtin.command:
    cmd: gpg --batch --gen-key
    stdin: |
      Key-Type: {{ protonmail_bridge_gpg_key_type }}
      Key-Length: {{ protonmail_bridge_gpg_key_length }}
      Subkey-Type: {{ protonmail_bridge_gpg_key_type }}
      Subkey-Length: {{ protonmail_bridge_gpg_key_length }}
      Name-Real: {{ protonmail_bridge_gpg_key_name }}
      Name-Email: {{ protonmail_bridge_gpg_key_email }}
      Expire-Date: 0
      %no-protection
      %commit
  become: true
  become_user: "{{ protonmail_bridge_user }}"
  environment:
    HOME: "{{ protonmail_bridge_home }}"
    GNUPGHOME: "{{ protonmail_bridge_home }}/.gnupg"
  changed_when: true
  when:
    - protonmail_bridge_manage_gpg | bool
    - protonmail_bridge_gpg_key.rc != 0

- name: Initialise the pass store
  ansible.builtin.command:
    cmd: "pass init {{ protonmail_bridge_gpg_key_email | quote }}"
    creates: "{{ protonmail_bridge_home }}/.password-store/.gpg-id"
  become: true
  become_user: "{{ protonmail_bridge_user }}"
  environment:
    HOME: "{{ protonmail_bridge_home }}"
    GNUPGHOME: "{{ protonmail_bridge_home }}/.gnupg"
    PASSWORD_STORE_DIR: "{{ protonmail_bridge_home }}/.password-store"
  when: protonmail_bridge_manage_gpg | bool
