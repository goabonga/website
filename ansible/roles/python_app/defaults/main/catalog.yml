# Catalog of the deployable components, keyed by component. Each entry is
# deep-merged over python_app_component_defaults, so it only states what
# differs from them. The first component of an application, named like the
# application, is its primary component (account, directory, release,
# database); the others set app. Host names come from website_hostnames and
# secrets from website_secrets: the catalog holds neither a domain nor a
# credential. Replace it entirely or adjust it with website_apps_overrides.
#
# Optional behaviours that need an operator decision are off by default, for
# example the wildcard certificate of the multi-tenant applications (auth and
# knowledge): enable it with nginx.ssl_wildcard, nginx.ssl_wildcard_domains
# and nginx.ssl_dns_provider in website_apps_overrides.
website_apps_catalog:
  analytics:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    postgres:
      database: analytics
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      CORS_ORIGINS: ["https://{{ website_hostnames.frontend }}", "https://www.{{ website_hostnames.frontend }}", "https://{{ website_hostnames.backend }}"]
      DATABASE_ECHO: "false"
      REDIS_URL: "{{ website_redis_url }}?db=7"
      CACHE_TTL: "300"
      GEOIP_ENABLED: "true"
      GEOIP_DATABASE_PATH: "/usr/share/GeoIP/GeoLite2-City.mmdb"
      SESSION_COOKIE_NAME: "ua_sid"
      SESSION_COOKIE_MAX_AGE: "31536000"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: "none"
      PIXEL_CACHE_CONTROL: "no-cache, no-store, must-revalidate"
      DATA_RETENTION_DAYS: "395"
      ANONYMIZE_IP: "false"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
    optional_secret_names: ["OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "analytics:read", description: "Read analytics data including sessions, events, and campaigns"}
        - {name: "analytics:write", description: "Create and manage analytics campaigns and tracking pixels", category: admin}
        - {name: "analytics:delete", description: "Delete and reset all analytics data (dangerous - super_admin only)", category: admin}
      roles:
        - name: analytics_user
          description: "User with access to Analytics API endpoints and dashboard"
          scopes: ["analytics:read"]
        - name: super_admin
          scopes: ["analytics:delete"]

  apt_server:
    extra_groups: ["mailler"]
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      client_max_body_size: "500M"
      custom_locations:
        - path: "/_internal/"
          config: |
            internal;
            alias /var/lib/apt-server/;
            sendfile on;
            tcp_nopush on;
    postgres:
      database: apt_server
      async_db: true
    alembic:
      enabled: true
    hardening:
      read_write_paths:
        - /var/lib/apt-server
    env_vars:
      REDIS_URL: "{{ website_redis_url }}?db=14"
      REDIS_KEY_PREFIX: "apt_server"
      APT_REPO_ROOT: "/var/lib/apt-server"
      APT_SUITES: "stable"
      APT_COMPONENTS: "main,private"
      APT_PUBLIC_COMPONENTS: "main"
      APT_ARCHITECTURES: "amd64,arm64,all"
      APT_INTERNAL_PREFIX: "/_internal"
      APT_INDEX_CACHE_TTL: "60"
      SESSION_COOKIE_NAME: "apt_session"
      SESSION_MAX_AGE: "86400"
      EMAIL_BACKEND: "mailler"
      MAILLER_URL: "http://localhost"
      MAILLER_UNIX_SOCKET: "/run/mailler/mailler.sock"
      MAILLER_PROVIDER: "{{ website_mailler_provider }}"
      MAILLER_AUTH_URL: "https://{{ website_hostnames.auth }}"
    secret_names: ["OAUTH2_CLIENT_SECRET", "SESSION_SECRET", "MAILLER_CLIENT_SECRET", "WEBHOOK_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "apt:read", description: "Authenticate as an apt-server user; per-package ACL determines visible packages"}
        - {name: "apt:write", description: "Upload and delete packages across all components"}
        - {name: "apt:admin", description: "Full admin: bypass ownership and ACL checks, force reindex"}
        - {name: "apt:write:main", description: "Upload and delete packages in the main component only", action: "write:main"}
        - {name: "apt:write:private", description: "Upload and delete packages in the private component only", action: "write:private"}

  asterisk:
    name: asterisk-bot
    type: audiosocket
    user: asterisk-bot
    postgres:
      database: application
      shared: true
      pgvector: true
    env_vars:
      LOG_LEVEL: "INFO"
      OPENAI_MODEL: "gpt-4o-realtime-preview-2024-12-17"
      OPENAI_VOICE: "verse"
      RAG_ENABLED: "true"
      RAG_SIMILARITY_THRESHOLD: "0.7"
      RAG_MAX_RESULTS: "3"
    secret_names: ["OPENAI_API_KEY"]
    asterisk:
      enabled: true
      context: fastagi-bot

  auth:
    extra_groups: ["mailler"]
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    postgres:
      database: auth
    alembic:
      enabled: true
    fail2ban:
      enabled: true
      routes:
        - {path: "/auth/register", method: POST, maxretry: 5, findtime: 10m, bantime: 1h}
        - {path: "/auth/login", method: POST, maxretry: 10, findtime: 5m, bantime: 30m}
        - {path: "/oauth2/token", method: POST, maxretry: 20, findtime: 1m, bantime: 15m}
        - {path: "/auth/password/reset", method: POST, maxretry: 5, findtime: 10m, bantime: 1h}
    env_vars:
      LOG_LEVEL: "INFO"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      JWKS_KEY_SIZE: "2048"
      JWKS_ROTATION_DAYS: "90"
      JWKS_GRACE_PERIOD_DAYS: "30"
      EMAIL_BACKEND: "mailler"
      SMTP_HOST: "{{ website_smtp_host }}"
      SMTP_PORT: "{{ website_smtp_port }}"
      SMTP_TLS: "true"
      MAILLER_URL: "http://localhost"
      MAILLER_UNIX_SOCKET: "/run/mailler/mailler.sock"
      MAILLER_PROVIDER: "{{ website_mailler_provider }}"
      MAILLER_AUTH_URL: "https://{{ website_hostnames.auth }}"
      SESSION_EXPIRY_DAYS: "7"
      SESSION_COOKIE_NAME: "session"
      SESSION_COOKIE_SECURE: "true"
      MFA_EMAIL_CODE_EXPIRY_MINUTES: "10"
      AUTHORIZATION_CODE_EXPIRY_MINUTES: "10"
      ACCESS_TOKEN_EXPIRY_MINUTES: "60"
      REFRESH_TOKEN_EXPIRY_DAYS: "30"
      ID_TOKEN_EXPIRY_MINUTES: "60"
      DEVICE_CODE_EXPIRY_MINUTES: "15"
      DEVICE_CODE_INTERVAL: "5"
      PAR_REQUEST_EXPIRY_SECONDS: "60"
      UPLOAD_DIRECTORY: "uploads"
      UPLOAD_MAX_SIZE_MB: "5"
      UPLOAD_ALLOWED_TYPES: "image/jpeg,image/png,image/gif,image/webp"
      TENANT_BASE_DOMAIN: "{{ website_hostnames.auth }}"
      TENANT_CUSTOM_DOMAIN_LOOKUP: "true"
    secret_names: ["JWKS_ENCRYPTION_KEY", "MAILLER_CLIENT_SECRET"]
    optional_secret_names: ["SMTP_PASSWORD"]

  auth_beat:
    app: auth
    type: celery_beat
    postgres:
      database: auth
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
    secret_names: ["JWKS_ENCRYPTION_KEY"]

  auth_worker:
    app: auth
    type: celery_worker
    extra_groups: ["mailler"]
    sudoers:
      - "/usr/sbin/nginx -t"
      - "/usr/bin/systemctl reload nginx"
      - "/usr/bin/certbot certonly *"
      - "/usr/bin/cp /tmp/* /etc/nginx/sites-enabled/*"
      - "/usr/bin/rm -f /etc/nginx/sites-enabled/custom-domain-*"
      - "/usr/bin/mkdir -p /var/www/certbot"
    celery:
      queues: ["auth"]
    postgres:
      database: auth
    hardening:
      read_write_paths:
        - /etc/nginx/sites-enabled
        - /etc/letsencrypt
        - /var/lib/letsencrypt
        - /var/www/certbot
        - /var/www/html
        - /var/log/letsencrypt
        - /var/log/nginx
        - /opt
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      EMAIL_BACKEND: "mailler"
      SMTP_HOST: "{{ website_smtp_host }}"
      SMTP_PORT: "{{ website_smtp_port }}"
      SMTP_TLS: "true"
      MAILLER_URL: "http://localhost"
      MAILLER_UNIX_SOCKET: "/run/mailler/mailler.sock"
      MAILLER_PROVIDER: "{{ website_mailler_provider }}"
      MAILLER_AUTH_URL: "https://{{ website_hostnames.auth }}"
      CUSTOM_DOMAIN_NGINX_SITES_DIR: "/etc/nginx/sites-enabled"
      CUSTOM_DOMAIN_NGINX_IPV4: "{{ website_listen_ipv4 }}"
      CUSTOM_DOMAIN_NGINX_IPV6: "{{ website_listen_ipv6 }}"
      CUSTOM_DOMAIN_UPSTREAM_SOCKET: "/run/auth/auth.sock"
      CUSTOM_DOMAIN_CERTBOT_ENABLED: "true"
      CUSTOM_DOMAIN_CERTBOT_EMAIL: "{{ website_certbot_email }}"
      CUSTOM_DOMAIN_DNS_CHECK_INTERVAL_MINUTES: "5"
    secret_names: ["JWKS_ENCRYPTION_KEY", "MAILLER_CLIENT_SECRET"]
    optional_secret_names: ["SMTP_PASSWORD"]

  backend:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    postgres:
      database: application
      shared: true
      pgvector: true
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DEBUG: "false"
      CORS_ORIGINS: ["https://{{ website_hostnames.backend }}", "https://{{ website_hostnames.frontend }}", "https://www.{{ website_hostnames.frontend }}"]
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      OPENAI_MODEL: "gpt-4o-mini"
      RAG_EMBEDDING_MODEL: "text-embedding-3-small"
      RAG_SIMILARITY_THRESHOLD: "0.7"
      RAG_MAX_RESULTS: "5"
      PROMPT_CACHE_REDIS_URL: "{{ website_redis_url }}?db=4"
      PROMPT_CACHE_TTL: "300"
      RATE_LIMIT_REDIS_URL: "{{ website_redis_url }}?db=2"
      RATE_LIMIT_ANON: "10"
      RATE_LIMIT_AUTH: "60"
      RATE_LIMIT_WINDOW: "60"
      SESSION_REDIS_URL: "{{ website_redis_url }}?db=3"
      SESSION_REDIS_TTL: "3600"
      SESSION_COOKIE_NAME: "session_id"
      SESSION_COOKIE_MAX_AGE: "2592000"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: "lax"
      SESSION_COOKIE_DOMAIN: ""
      SESSION_CREATE_LIMIT: "10"
      SESSION_CREATE_WINDOW: "3600"
      CONVERSATION_CACHE_TTL: "1800"
      CONVERSATION_SYNC_INTERVAL: "30"
    secret_names: ["OPENAI_API_KEY", "OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true

  backend_beat:
    app: backend
    type: celery_beat
    postgres:
      database: application
      shared: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"

  backend_worker:
    app: backend
    type: celery_worker
    celery:
      concurrency: 4
      queues: ["backend"]
    postgres:
      database: application
      shared: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      OPENAI_MODEL: "gpt-4o-mini"
      RAG_EMBEDDING_MODEL: "text-embedding-3-small"
      RAG_SIMILARITY_THRESHOLD: "0.7"
      RAG_MAX_RESULTS: "5"
      SESSION_REDIS_URL: "{{ website_redis_url }}?db=3"
      SESSION_REDIS_TTL: "3600"
      CONVERSATION_CACHE_TTL: "1800"
      CONVERSATION_SYNC_INTERVAL: "30"
    secret_names: ["OPENAI_API_KEY"]

  billing:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
    postgres:
      database: billing
      async_db: true
    alembic:
      enabled: true
    env_defaults: "{{ website_billing_shared_env }}"
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      DATABASE_ECHO: "false"
      REDIS_URL: "{{ website_redis_url }}?db=12"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_billing_celery_queue }}"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      CORS_ORIGINS: "{{ website_billing_cors_origins }}"
      PARTITION_ADMIN_SCOPE: "{{ website_billing_partition_admin_scope }}"
      PARTITION_ALLOW_UNBOUND: "{{ website_billing_partition_allow_unbound }}"
      PLANS_PUBLIC: "{{ website_billing_plans_public }}"
      REDIRECT_ALLOWLIST_REQUIRED: "{{ website_billing_redirect_allowlist_required }}"
      STRIPE_WEBHOOK_REQUIRED_SCOPE: "{{ website_billing_stripe_webhook_required_scope }}"
      STRIPE_PUBLISHABLE_KEY: "{{ website_billing_stripe_publishable_key }}"
    secret_names: ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET", "OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "billing:*", description: "Full access to all Billing API operations"}
        - {name: "billing:read", description: "Read billing information (subscriptions, customers, invoices)"}
        - {name: "billing:write", description: "Create and update subscriptions, products, and prices"}
        - {name: "billing:admin", description: "Full administrative access including SaaS app management"}
        - {name: "billing:checkout:write", description: "Create Stripe checkout sessions for customers"}
        - {name: "billing:usage:write", description: "Report usage events for metered billing"}
        - {name: "billing:platform:read", description: "Read platform resources (SaaS apps, customers, products, prices, subscriptions)"}
        - {name: "billing:platform:write", description: "Create and update platform resources (SaaS apps, customers, products, prices, subscriptions)"}
        - {name: "billing:webhooks", description: "Receive and process Stripe webhook events"}
      roles:
        - name: billing_user
          description: "User with read-only access to billing information"
          scopes: ["billing:platform:read", "billing:read"]
        - name: billing_manager
          description: "Manager with access to create and manage subscriptions"
          scopes: ["billing:checkout:write", "billing:platform:read", "billing:platform:write", "billing:read", "billing:usage:write", "billing:write"]
        - name: billing_admin
          description: "Administrator with full access to the Billing platform"
          scopes: ["billing:*"]

  billing_beat:
    app: billing
    type: celery_beat
    postgres:
      database: billing
      async_db: true
    env_defaults: "{{ website_billing_shared_env }}"
    env_vars:
      DOCS_ENABLED: "false"
      DATABASE_ECHO: "false"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_billing_celery_queue }}"

  # The worker also delivers the notifications to the webhook URL of each SaaS
  # application: nothing in the unit restricts its network, so the host only
  # needs a route to those URLs.
  billing_worker:
    app: billing
    type: celery_worker
    celery:
      queues: ["{{ website_billing_celery_queue }}"]
    postgres:
      database: billing
      async_db: true
    env_defaults: "{{ website_billing_shared_env }}"
    env_vars:
      DOCS_ENABLED: "false"
      DATABASE_ECHO: "false"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_billing_celery_queue }}"
      REDIS_URL: "{{ website_redis_url }}?db=12"
    secret_names: ["STRIPE_SECRET_KEY"]

  custom_domain:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
    postgres:
      database: custom_domain
      async_db: true
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      REDIS_URL: "{{ website_redis_url }}?db=13"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_custom_domain_celery_queue }}"
      DEFAULT_CNAME_TARGET: "{{ website_custom_domain_cname_target }}"
      TOKEN_VALIDATION_MODE: "introspection"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
    secret_names: ["OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "custom-domain:read", description: "Read custom domain configurations and status"}
        - {name: "custom-domain:write", description: "Create, update, and manage custom domains"}
        - {name: "custom-domain:admin", description: "Full administrative access (delete, force operations)"}
        - {name: "custom-domain:lookup", description: "DNS verification and domain lookup operations"}
      roles:
        - name: custom_domain_user
          description: "User with read and lookup access to Custom Domain Service"
          scopes: ["custom-domain:lookup", "custom-domain:read"]
        - name: custom_domain_manager
          description: "Manager with read, write, and lookup access to Custom Domain Service"
          scopes: ["custom-domain:lookup", "custom-domain:read", "custom-domain:write"]
        - name: custom_domain_admin
          description: "Administrator with full access to Custom Domain Service"
          scopes: ["custom-domain:admin", "custom-domain:lookup", "custom-domain:read", "custom-domain:write"]

  custom_domain_beat:
    app: custom_domain
    type: celery_beat
    postgres:
      database: custom_domain
      async_db: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_custom_domain_celery_queue }}"
      REDIS_URL: "{{ website_redis_url }}?db=13"
      DNS_CHECK_INTERVAL_MINUTES: "5"
      CERTIFICATE_RENEWAL_DAYS: "30"
      DOMAIN_ACTIVATION_TIMEOUT_HOURS: "48"
      DOMAIN_HEALTH_CHECK_INTERVAL_HOURS: "24"
      SOFT_DELETE_PURGE_DAYS: "30"

  # The worker is the only process that reaches the privileged helper: it needs
  # sudo (no NoNewPrivileges) and write access to the paths the helper touches.
  # The paths marked with - may not exist before the first certificate.
  custom_domain_worker:
    app: custom_domain
    type: celery_worker
    custom_domain_helper:
      enabled: true
    celery:
      queues: ["{{ website_custom_domain_celery_queue }}"]
    postgres:
      database: custom_domain
      async_db: true
    hardening:
      read_write_paths:
        - "{{ website_custom_domain_staging_dir }}"
        - "{{ website_custom_domain_sites_dir }}"
        - "{{ website_custom_domain_webroot }}"
        - "-{{ website_custom_domain_letsencrypt_dir }}"
        - "-/var/lib/letsencrypt"
        - "-/var/log/letsencrypt"
        - "-/var/log/nginx"
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_custom_domain_celery_queue }}"
      REDIS_URL: "{{ website_redis_url }}?db=13"
      NGINX_SITES_DIR: "{{ website_custom_domain_sites_dir }}"
      NGINX_CONFIG_PREFIX: "{{ website_custom_domain_config_prefix }}"
      NGINX_IPV4: "{{ website_listen_ipv4 }}"
      NGINX_IPV6: "{{ website_listen_ipv6 }}"
      NGINX_BIN: "{{ website_custom_domain_nginx_bin }}"
      NGINX_SERVICE: "{{ website_custom_domain_nginx_service }}"
      SYSTEMCTL_BIN: "{{ website_custom_domain_systemctl_bin }}"
      CERTBOT_ENABLED: "true"
      CERTBOT_BIN: "{{ website_custom_domain_certbot_bin }}"
      CERTBOT_EMAIL: "{{ python_app__custom_domain_email }}"
      CERTBOT_WEBROOT: "{{ website_custom_domain_webroot }}"
      OPENSSL_BIN: "{{ website_custom_domain_openssl_bin }}"
      LETSENCRYPT_DIR: "{{ website_custom_domain_letsencrypt_dir }}"
      PRIVILEGED_HELPER: "{{ website_custom_domain_helper }}"
      PRIVILEGED_STAGING_DIR: "{{ website_custom_domain_staging_dir }}"
      DNS_CHECK_INTERVAL_MINUTES: "5"
      CERTIFICATE_RENEWAL_DAYS: "30"
      DOMAIN_ACTIVATION_TIMEOUT_HOURS: "48"
      DOMAIN_HEALTH_CHECK_INTERVAL_HOURS: "24"
      SOFT_DELETE_PURGE_DAYS: "30"

  frontend:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      redirect_domains:
        - "www.{{ website_hostnames.frontend }}"
      static:
        enabled: true
        location: /static
        alias: apps/frontend/web/dist
    env_vars:
      LOG_LEVEL: "INFO"
      DEBUG: "false"
      AUTH_URL: "https://{{ website_hostnames.auth }}"
      API_URL: "https://{{ website_hostnames.backend }}"
      ANALYTICS_URL: "https://{{ website_hostnames.analytics }}"
    oauth2:
      enabled: true
    build_node: true
    build_chdir: apps/frontend/web
    build_commands:
      - npm ci
      - npm run build

  internal:
    extra_groups: ["mailler", "billing", "team"]
    gunicorn:
      workers: 1
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
    postgres:
      database: application
      shared: true
    env_vars:
      LOG_LEVEL: "INFO"
      REDIS_URL: "{{ website_redis_url }}?db=3"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      APP_BASE_URL: "https://{{ website_hostnames.internal }}"
      COOKIE_SECURE: "true"
      RAG_EMBEDDING_MODEL: "text-embedding-3-small"
      ANALYTICS_API_URL: "https://{{ website_hostnames.analytics }}"
      VPN_PORTAL_API_URL: "https://{{ website_hostnames.vpn_portal }}"
      MAILLER_SOCKET_PATH: "/run/mailler/mailler.sock"
      MAILLER_DEFAULT_PROVIDER: "{{ website_mailler_provider }}"
      MAILLER_API_URL: "{{ website_internal_mailler_api_url }}"
      BILLING_API_URL: "{{ website_internal_billing_api_url }}"
      BILLING_SOCKET_PATH: "/run/billing/billing.sock"
      BILLING_READ_SCOPE: "{{ website_internal_billing_read_scope }}"
      BILLING_WRITE_SCOPE: "{{ website_internal_billing_write_scope }}"
      BILLING_ADMIN_SCOPE: "{{ website_internal_billing_admin_scope }}"
      BILLING_TIMEOUT: "{{ website_internal_billing_timeout }}"
      BILLING_PAGE_SIZE: "{{ website_internal_billing_page_size }}"
      BILLING_RECENT_LIMIT: "{{ website_internal_billing_recent_limit }}"
      MAILLER_ADMIN_SCOPE: "{{ website_internal_mailler_admin_scope }}"
      MAILLER_TIMEOUT: "{{ website_internal_mailler_timeout }}"
      MAILLER_CLIENTS_PAGE_SIZE: "{{ website_internal_mailler_clients_page_size }}"
      TEAM_SOCKET_PATH: "/run/team/team.sock"
    secret_names: ["SECRET_KEY", "OAUTH2_CLIENT_SECRET", "OPENAI_API_KEY"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "internal:*", description: "All internal admin operations"}
        - {name: "namespaces:*", description: "All namespace operations"}
        - {name: "namespaces:read", description: "View knowledge namespaces"}
        - {name: "namespaces:write", description: "Create and update knowledge namespaces"}
        - {name: "namespaces:delete", description: "Delete knowledge namespaces"}
        - {name: "prompts:*", description: "All prompt operations"}
        - {name: "prompts:read", description: "View system prompts"}
        - {name: "prompts:write", description: "Create and update system prompts"}
        - {name: "prompts:delete", description: "Delete system prompts"}
        - {name: "knowledge:*", description: "All knowledge operations"}
        - {name: "knowledge:read", description: "View knowledge base entries"}
        - {name: "knowledge:write", description: "Create and update knowledge base entries"}
        - {name: "knowledge:delete", description: "Delete knowledge base entries"}
        - {name: "conversations:*", description: "All conversation operations"}
        - {name: "conversations:read", description: "View chat conversations and dashboard"}
        - {name: "conversations:delete", description: "Delete chat conversations"}
        - {name: "email_templates:read", description: "View email templates and preview compiled HTML", category: admin}
        - {name: "email_templates:write", description: "Create and update email templates with MJML editor", category: admin}
        - {name: "email_templates:delete", description: "Delete email templates", category: admin}
        - {name: "contacts:read", description: "View contacts, contact groups, and export CSV", category: admin}
        - {name: "contacts:write", description: "Create and update contacts, import CSV, manage group membership", category: admin}
        - {name: "contacts:delete", description: "Delete contacts and contact groups", category: admin}
        - {name: "email_campaigns:read", description: "View email campaigns, statistics and send history", category: admin}
        - {name: "email_campaigns:write", description: "Create and update email campaigns", category: admin}
        - {name: "email_campaigns:send", description: "Send, pause and resume email campaigns", category: admin}
        - {name: "email_campaigns:delete", description: "Delete email campaigns", category: admin}
        - {name: "analytics:write", description: "Create and manage analytics campaigns and tracking pixels", category: admin}
      roles:
        - name: internal_admin
          description: "Full access to all internal admin resources"
          scopes: ["analytics:write", "contacts:delete", "contacts:read", "contacts:write", "email_campaigns:delete", "email_campaigns:read", "email_campaigns:send", "email_campaigns:write", "email_templates:delete", "email_templates:read", "email_templates:write", "internal:*"]
        - name: internal_editor
          description: "Read and write access to internal resources (no delete)"
          scopes: ["conversations:read", "knowledge:read", "knowledge:write", "namespaces:read", "namespaces:write", "prompts:read", "prompts:write"]
        - name: internal_viewer
          description: "Read-only access to all internal resources"
          scopes: ["conversations:read", "knowledge:read", "namespaces:read", "prompts:read"]
        - name: knowledge_manager
          description: "Full access to knowledge base and namespaces"
          scopes: ["knowledge:*", "namespaces:*"]
        - name: prompt_manager
          description: "Full access to system prompts"
          scopes: ["prompts:*"]
        - name: conversation_viewer
          description: "Read-only access to chat conversations"
          scopes: ["conversations:read"]
      scope_groups:
        "internal:*": [namespaces, prompts, knowledge, conversations]

  internal_worker:
    app: internal
    type: celery_worker
    extra_groups: ["mailler", "billing", "team"]
    celery:
      queues: ["internal"]
    postgres:
      database: application
      shared: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      REDIS_URL: "{{ website_redis_url }}?db=3"
      MAILLER_SOCKET_PATH: "/run/mailler/mailler.sock"
      MAILLER_DEFAULT_PROVIDER: "{{ website_mailler_provider }}"
      MAILLER_API_URL: "{{ website_internal_mailler_api_url }}"
      BILLING_API_URL: "{{ website_internal_billing_api_url }}"
      BILLING_SOCKET_PATH: "/run/billing/billing.sock"
      TEAM_SOCKET_PATH: "/run/team/team.sock"
    secret_names: ["SECRET_KEY", "OAUTH2_CLIENT_SECRET", "OPENAI_API_KEY"]

  knowledge:
    extra_groups: ["billing", "custom-domain"]
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      webhook_paths:
        - /webhooks/billing
        - /webhooks/custom-domain
    postgres:
      database: knowledge
      pgvector: true
      async_db: true
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      REDIS_URL: "{{ website_redis_url }}?db=9"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_knowledge_celery_queue }}"
      CELERY_TIMEZONE: "{{ website_knowledge_celery_timezone }}"
      EMBEDDING_MODEL: "text-embedding-3-small"
      EMBEDDING_DIMENSION: "1536"
      DEFAULT_SIMILARITY_THRESHOLD: "0.7"
      DEFAULT_SEARCH_LIMIT: "10"
      MAX_SEARCH_LIMIT: "100"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW: "60"
      OAUTH2_TOKEN_CACHE_TTL: "300"
      OAUTH2_INTROSPECTION_CACHE_TTL: "60"
      APP_BASE_URL: "https://{{ website_hostnames.knowledge }}"
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: "{{ website_hostnames.knowledge }}"
      TENANT_BASE_DOMAIN: "{{ website_hostnames.knowledge }}"
      TENANT_CUSTOM_DOMAIN_LOOKUP: "true"
      OPERATOR_NAME: "{{ website_knowledge_operator_name }}"
      CONTACT_EMAIL: "{{ website_knowledge_contact_email }}"
      SALES_EMAIL: "{{ website_knowledge_sales_email }}"
      LEGAL_EMAIL: "{{ website_knowledge_legal_email }}"
      PRIVACY_EMAIL: "{{ website_knowledge_privacy_email }}"
      SUPPORT_URL: "{{ website_knowledge_support_url }}"
      QUOTA_FALLBACK_LIMITS: "{{ website_knowledge_quota_fallback_limits }}"
      BILLING_SOCKET_PATH: "/run/billing/billing.sock"
      BILLING_CLIENT_ID: "{{ website_knowledge_billing_client_id }}"
      BILLING_SAAS_ID: "{{ website_knowledge_billing_saas_id }}"
      BILLING_APP_SLUG: "{{ website_knowledge_billing_app_slug }}"
      BILLING_CHECKOUT_SUCCESS_URL: "{{ website_knowledge_billing_checkout_success_url }}"
      BILLING_CHECKOUT_CANCEL_URL: "{{ website_knowledge_billing_checkout_cancel_url }}"
      CUSTOM_DOMAIN_SERVICE_SOCKET_PATH: "/run/custom-domain/custom-domain.sock"
      CUSTOM_DOMAIN_CLIENT_ID: "{{ website_knowledge_custom_domain_client_id }}"
      CUSTOM_DOMAIN_CNAME_TARGET: "{{ website_knowledge_custom_domain_cname_target }}"
    secret_names: ["OPENAI_API_KEY", "OAUTH2_CLIENT_SECRET", "BILLING_WEBHOOK_SECRET", "CUSTOM_DOMAIN_WEBHOOK_SECRET"]
    optional_secret_names: ["BILLING_CLIENT_SECRET", "CUSTOM_DOMAIN_CLIENT_SECRET", "GITHUB_WEBHOOK_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "knowledge:read", description: "View knowledge base entries"}
        - {name: "knowledge:write", description: "Create and update knowledge base entries"}
        - {name: "knowledge:search", description: "Perform semantic searches across collections and documents"}
        - {name: "collections:read", description: "Read collections"}
        - {name: "collections:write", description: "Create, update, and delete collections"}
        - {name: "collections:search", description: "Perform semantic searches across collections and documents"}
        - {name: "documents:read", description: "Read documents"}
        - {name: "documents:write", description: "Create, update, and delete documents"}
      roles:
        - name: knowledge_reader
          description: "Read-only access to Knowledge API (view collections, documents, search)"
          scopes: ["collections:read", "collections:search", "documents:read", "knowledge:read", "knowledge:search"]
        - name: knowledge_user
          description: "Full access to Knowledge API (create, read, update, delete)"
          scopes: ["collections:read", "collections:search", "collections:write", "documents:read", "documents:write", "knowledge:read", "knowledge:search", "knowledge:write"]
      clients:
        - client_id: "{{ (website_oauth2_clients.get('knowledge') or {}).get('client_id', '') }}"
          allowed_scopes: ["billing:checkout:write"]
          allowed_grant_types: [client_credentials]

  knowledge_beat:
    app: knowledge
    type: celery_beat
    postgres:
      database: knowledge
      async_db: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_knowledge_celery_queue }}"
      CELERY_TIMEZONE: "{{ website_knowledge_celery_timezone }}"

  # The worker sends the emails through mailler and keeps the custom domains in
  # step with the custom-domain service: it needs their sockets and the OAuth
  # client of the application, and nothing else (no sudo, nginx or certbot).
  knowledge_worker:
    app: knowledge
    type: celery_worker
    extra_groups: ["mailler", "custom-domain"]
    celery:
      queues: ["{{ website_knowledge_celery_queue }}"]
    postgres:
      database: knowledge
      async_db: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_knowledge_celery_queue }}"
      CELERY_TIMEZONE: "{{ website_knowledge_celery_timezone }}"
      APP_BASE_URL: "https://{{ website_hostnames.knowledge }}"
      MAILLER_SOCKET_PATH: "/run/mailler/mailler.sock"
      MAILLER_CLIENT_ID: "{{ website_knowledge_mailler_client_id }}"
      CUSTOM_DOMAIN_SERVICE_SOCKET_PATH: "/run/custom-domain/custom-domain.sock"
      CUSTOM_DOMAIN_CLIENT_ID: "{{ website_knowledge_custom_domain_client_id }}"
    secret_names: ["OPENAI_API_KEY", "OAUTH2_CLIENT_SECRET"]
    optional_secret_names: ["MAILLER_CLIENT_SECRET", "CUSTOM_DOMAIN_CLIENT_SECRET"]
    oauth2:
      enabled: true

  mailler:
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
    postgres:
      database: mailler
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      REDIS_URL: "{{ website_redis_url }}?db=11"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_mailler_celery_queue }}"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      ADMIN_SCOPE: "{{ website_mailler_admin_scope }}"
      CORS_ORIGINS: "{{ website_mailler_cors_origins }}"
      LEGACY_CLIENT_ID: "{{ website_mailler_legacy_client_id }}"
      UNSUBSCRIBE_BASE_URL: "{{ website_mailler_unsubscribe_base_url }}"
      PROTONMAIL_HOST: "{{ website_mailler_protonmail_host }}"
      PROTONMAIL_PORT: "{{ website_mailler_protonmail_port }}"
      PROTONMAIL_USER: "{{ website_mailler_protonmail_user }}"
      SES_REGION: "{{ website_mailler_ses_region }}"
    secret_names: ["OAUTH2_CLIENT_SECRET", "BREVO_API_KEY", "WEBHOOK_HMAC_SECRET"]
    optional_secret_names: ["SENDGRID_API_KEY", "SES_ACCESS_KEY", "SES_SECRET_KEY", "PROTONMAIL_PASSWORD"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "mailler:*", description: "Full access to all Mailler API operations"}
        - {name: "mailler:send", description: "Send and schedule emails via the Mailler API"}
        - {name: "mailler:read", description: "Read email details and list emails"}
        - {name: "mailler:stats", description: "View email sending statistics"}
        - {name: "mailler:webhooks", description: "Receive and process email provider webhook events (Brevo, SES, SendGrid)"}
      roles:
        - name: mailler_user
          description: "User with access to send emails and read email status via Mailler API"
          scopes: ["mailler:read", "mailler:send"]
        - name: mailler_admin
          description: "Administrator with full access to Mailler API"
          scopes: ["mailler:*"]

  mailler_beat:
    app: mailler
    type: celery_beat
    postgres:
      database: mailler
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_mailler_celery_queue }}"

  mailler_worker:
    app: mailler
    type: celery_worker
    celery:
      concurrency: 4
      queues: ["{{ website_mailler_celery_queue }}"]
    postgres:
      database: mailler
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      CELERY_QUEUE: "{{ website_mailler_celery_queue }}"
      PROTONMAIL_HOST: "{{ website_mailler_protonmail_host }}"
      PROTONMAIL_PORT: "{{ website_mailler_protonmail_port }}"
      PROTONMAIL_USER: "{{ website_mailler_protonmail_user }}"
      SES_REGION: "{{ website_mailler_ses_region }}"
    secret_names: ["BREVO_API_KEY", "WEBHOOK_HMAC_SECRET"]
    optional_secret_names: ["SENDGRID_API_KEY", "SES_ACCESS_KEY", "SES_SECRET_KEY", "PROTONMAIL_PASSWORD"]

  mta_sts:
    gunicorn:
      workers: 1
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    env_vars:
      MTA_STS_MODE: "enforce"
      MTA_STS_MAX_AGE: "86400"

  reachy_mini_api:
    gunicorn:
      workers: 1
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
      websocket:
        enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DEBUG: "false"
      CORS_ORIGINS: ["https://{{ website_hostnames.reachy_mini_api }}"]
      REDIS_URL: "{{ website_redis_url }}?db=6"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      JWKS_CACHE_TTL: "3600"
    secret_names: ["OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "reachy:reports:read", description: "Read Reachy robot reports and daily summaries"}
        - {name: "reachy:notifications:read", description: "Read Reachy notifications"}
        - {name: "reachy:status:read", description: "Read Reachy robot status information"}
      roles:
        - name: reachy_user
          description: "User with access to Reachy Mini API endpoints"
          scopes: ["reachy:notifications:read", "reachy:reports:read", "reachy:status:read"]

  team:
    extra_groups: ["mailler", "analytics", "auth"]
    healthcheck:
      enabled: true
    nginx:
      enabled: true
      ssl: step-ca
      internal_domain: true
    postgres:
      database: team
      pgvector: true
      async_db: true
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      REDIS_URL: "{{ website_redis_url }}?db=14"
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      MAILLER_BASE_URL: "unix:///run/mailler/mailler.sock"
      ANALYTICS_BASE_URL: "unix:///run/analytics/analytics.sock"
      AUTH_BASE_URL: "unix:///run/auth/auth.sock"
    secret_names: ["OPENAI_API_KEY"]
    optional_secret_names: ["ANTHROPIC_API_KEY", "OAUTH2_CLIENT_SECRET", "GITHUB_TOKEN"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "team:*", description: "Full access to all Team API operations"}
        - {name: "team:read", description: "Read messages and conversation state during runtime"}
        - {name: "team:write", description: "Post messages and report usage events"}
        - {name: "team:platform:read", description: "Read teams, agents, workflows, conversations, and memory"}
        - {name: "team:platform:write", description: "Create, update, and delete teams, agents, workflows, and conversations"}
      roles:
        - name: team_user
          description: "User with runtime access to Team API (read and write messages)"
          scopes: ["team:read", "team:write"]
        - name: team_admin
          description: "Administrator with full access to Team API"
          scopes: ["team:*"]

  team_beat:
    app: team
    type: celery_beat
    extra_path: ["/usr/bin", "/usr/local/bin"]
    postgres:
      database: team
      async_db: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      REDIS_URL: "{{ website_redis_url }}?db=14"

  team_worker:
    app: team
    type: celery_worker
    extra_groups: ["mailler", "analytics", "auth"]
    extra_path: ["/usr/bin", "/usr/local/bin"]
    celery:
      queues: ["team"]
    postgres:
      database: team
      async_db: true
    env_vars:
      CELERY_BROKER_URL: "{{ website_celery_broker_url }}"
      CELERY_RESULT_BACKEND: "{{ website_celery_result_backend }}"
      REDIS_URL: "{{ website_redis_url }}?db=14"
      MAILLER_BASE_URL: "unix:///run/mailler/mailler.sock"
      ANALYTICS_BASE_URL: "unix:///run/analytics/analytics.sock"
      AUTH_BASE_URL: "unix:///run/auth/auth.sock"
    secret_names: ["OPENAI_API_KEY"]
    optional_secret_names: ["ANTHROPIC_API_KEY", "GITHUB_TOKEN"]

  vpn_portal:
    stepca_group_member: true
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    postgres:
      database: vpn_portal
    alembic:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DEBUG: "false"
      STEPCA_URL: "https://127.0.0.1:8443"
      STEPCA_ROOT_CA: "/etc/step-ca/certs/root_ca.crt"
      STEPCA_PROVISIONER: "vpn-portal"
      STEPCA_PROVISIONER_PASSWORD_FILE: "/etc/step-ca/secrets/vpn-portal-password"
      CERT_DEFAULT_DURATION_MINUTES: "10"
      CERT_MAX_DURATION_MINUTES: "15"
      OAUTH2_CLIENT_CACHE_TTL: "300"
      TOKEN_INTROSPECTION_CACHE_TTL: "60"
      JWKS_CACHE_TTL: "3600"
      REDIS_URL: "{{ website_redis_url }}?db=8"
      OPENVPN_PORT: "1194"
      OPENVPN_PROTO: "udp"
      OPENVPN_CA_PATH: "/etc/openvpn/server/ca.crt"
      OPENVPN_TA_KEY_PATH: "/etc/openvpn/server/ta.key"
    secret_names: ["STEPCA_PROVISIONER_PASSWORD", "OAUTH2_CLIENT_SECRET"]
    oauth2:
      enabled: true
    auth_catalog:
      scopes:
        - {name: "vpn:connect", description: "Basic VPN connection - required for all VPN users", category: vpn}
        - {name: "vpn:admin", description: "VPN administration - view sessions, revoke certificates, manage users", category: vpn}
        - {name: "vpn:internal", description: "Access to internal services network (10.8.0.0/24, 10.0.0.0/8)", category: vpn}
        - {name: "vpn:infrastructure", description: "Access to infrastructure network (192.168.0.0/16)", category: vpn}
        - {name: "vpn:development", description: "Access to development environment", category: vpn}
        - {name: "vpn:production", description: "Access to production environment", category: vpn}
        - {name: "vpn:server", description: "OpenVPN server hook scripts - validate certificates, record connections", category: vpn}
      roles:
        - name: vpn_user
          description: "Basic VPN user with access to internal services"
          scopes: ["vpn:connect", "vpn:internal"]
        - name: vpn_admin
          description: "VPN administrator with full access and management capabilities"
          scopes: ["vpn:admin", "vpn:connect", "vpn:infrastructure", "vpn:internal"]
        - name: vpn_developer
          description: "Developer with VPN access to development environment"
          scopes: ["vpn:connect", "vpn:development", "vpn:internal"]
        - name: vpn_operator
          description: "Operator with VPN access to production environment"
          scopes: ["vpn:connect", "vpn:internal", "vpn:production"]

  vpn_portal_openvpn:
    app: vpn_portal
    type: script
    hardening:
      enabled: false
    env_vars:
      OPENVPN_OAUTH2_TOKEN_URL: "https://{{ website_hostnames.auth }}/oauth2/token"
      OPENVPN_API_BASE_URL: "https://{{ website_hostnames.vpn_portal }}"
      OPENVPN_OAUTH2_CLIENT_ID: "{{ (website_oauth2_clients.get('vpn_portal') or {}).get('openvpn_client_id', '') }}"
      OPENVPN_OAUTH2_SCOPE: "vpn:server"
      OPENVPN_TOKEN_CACHE_PATH: "/var/run/vpn-portal-openvpn/token.json"
      OPENVPN_MANAGEMENT_HOST: "127.0.0.1"
      OPENVPN_MANAGEMENT_PORT: "7505"
    secret_names: ["OPENVPN_OAUTH2_CLIENT_SECRET"]
    script:
      wrappers:
        - {name: openvpn-connect, entrypoint: scripts/openvpn.py, args: --connect}
        - {name: openvpn-disconnect, entrypoint: scripts/openvpn.py, args: --disconnect}
        - {name: openvpn-reneg, entrypoint: scripts/openvpn.py, args: --reneg}
    openvpn:
      hook_connect: openvpn-connect
      hook_disconnect: openvpn-disconnect
      hook_reneg: openvpn-reneg
      reneg_sec: 30
      management_port: 7505

  webhooks:
    extra_groups: ["internal", "mailler", "billing"]
    gunicorn:
      workers: 1
    healthcheck:
      enabled: true
    nginx:
      enabled: true
    env_vars:
      LOG_LEVEL: "INFO"
      DOCS_ENABLED: "false"
      OAUTH2_TOKEN_URL: "https://{{ website_hostnames.auth }}/oauth2/token"
      OAUTH2_CLIENT_ID: "{{ (website_oauth2_clients.get('webhooks') or {}).get('client_id', '') }}"
      SES_ENABLED: "false"
      BREVO_ENABLED: "true"
      BREVO_INTERNAL_API_SOCKET: "/run/mailler/mailler.sock"
      SENDGRID_ENABLED: "false"
      STRIPE_ENABLED: "true"
      STRIPE_INTERNAL_API_SOCKET: "/run/billing/billing.sock"
      GITHUB_ENABLED: "false"
    # The OAuth client (website_oauth2_clients.webhooks and the OAUTH2_CLIENT_SECRET
    # secret) only authenticates the events forwarded to mailler. billing checks
    # the Stripe signature and ignores the token, so a gateway that only forwards
    # Stripe events needs neither.
    optional_secret_names: ["OAUTH2_CLIENT_SECRET"]
    auth_catalog:
      scopes:
        - {name: "mailler:webhooks", description: "Receive and process email provider webhook events (Brevo, SES, SendGrid)"}
