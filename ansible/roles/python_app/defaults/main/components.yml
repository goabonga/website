# Every catalog entry is a component: one systemd unit (or one set of wrapper
# scripts) of an application. The catalog entry and the matching
# website_apps_overrides entry are deep-merged over these defaults, so a
# component only states what differs.
python_app_component_defaults:
  # Set to false to skip this component (for example a worker or a beat).
  enabled: true
  # Application the component belongs to (catalog key of the primary one).
  app: ""
  # The primary component of an application owns the application directory,
  # the account, the database and the release; the others are additional
  # units running the same code.
  primary: false
  # systemd unit name and file name prefix of the component.
  name: ""
  # Import package of the application (apps/<name>/src/<module>); defaults to
  # the application name.
  module: ""
  # uv workspace package; defaults to the application name with dashes.
  package: ""
  # Kind of process. gunicorn runs an ASGI service, celery_worker and
  # celery_beat run Celery and daemon runs python -m <module>.
  # audiosocket and fastagi run the Asterisk integrations.
  # script deploys wrapper scripts and has no unit.
  type: gunicorn
  # Branch, tag or commit of the application (primary component only);
  # website_repo_version when empty.
  version: ""
  # System account running the application (primary component only); the
  # application name with dashes when empty.
  user: ""
  group: ""
  # Extra groups of the account, merged for every component of the
  # application. Used for access to the sockets of other applications.
  extra_groups: []
  # Extra entries appended to PATH in the unit.
  extra_path: []
  # Commands the application account may run through sudo without password.
  # NoNewPrivileges is lifted for the units of components that set it.
  sudoers: []
  # Join the step group to read the provisioner password.
  stepca_group_member: false

  # Health probe: the unit is only considered started once it answers.
  healthcheck:
    enabled: false
    path: /health
    # Seconds to wait for the probe.
    timeout: 10

  gunicorn:
    workers: 2
    # Listen on /run/<name>/<name>.sock instead of host:port.
    socket: true
    host: 127.0.0.1
    port: 8000
    # ASGI path, <module>.main:app when empty.
    module: ""
    worker_class: uvicorn.workers.UvicornWorker
  celery:
    # Celery application, <module>.celery:celery_app when empty.
    app: ""
    loglevel: info
    concurrency: 2
    queues: []
    # Beat scheduler class (empty uses the default one).
    scheduler: ""
  daemon:
    # Module run with python -m, <module>.main when empty.
    module: ""
    args: ""
    stop_timeout: 30
  fastagi:
    # Module run with python -m, <module>.main when empty.
    module: ""
    host: 127.0.0.1
    port: 4573
    # Script name requested by the dialplan.
    agi_script: bot
  audiosocket:
    # Module run with python -m, <module>.main when empty.
    module: ""
    host: 127.0.0.1
    port: 9092
  asterisk:
    # Install a dialplan include for the fastagi and audiosocket types.
    enabled: false
    context: fastagi-bot
    # Extension that jumps to the context, for tests (empty for none).
    test_extension: ""
  script:
    # Wrapper scripts created in <app>/bin by the script type. Each entry:
    # {name, entrypoint (relative to apps/<package>), args}.
    wrappers: []
  # OpenVPN hook integration of the script type: {hook_connect,
  # hook_disconnect, hook_reneg, reneg_sec, management_port, server_conf}.
  # Each hook names a wrapper.
  openvpn: {}

  # Commands run in the release as the application account, after uv sync, for
  # example the build of a web client.
  build_commands: []
  # Directory the commands run in, relative to the release root.
  build_chdir: ""
  # Install Node.js on the host before running build_commands.
  build_node: false

  nginx:
    enabled: false
    # Host name served; the entry of website_hostnames when empty.
    domain: ""
    # letsencrypt, step-ca or false for plain HTTP.
    ssl: letsencrypt
    # Cover subdomains with a wildcard certificate (needs the DNS-01 challenge).
    ssl_wildcard: false
    ssl_wildcard_domains: []
    # manual (the certificate must exist) or route53.
    ssl_dns_provider: manual
    # With route53, create the wildcard CNAME records pointing to this target.
    dns_wildcard_cname_target: ""
    # Alternate host names redirected (301) to the domain; they are added to
    # the certificate (letsencrypt without wildcard only).
    redirect_domains: []
    # Listen on website_internal_listen instead of the public addresses and
    # register the host name in dnsmasq.
    internal_domain: false
    # Networks allowed to reach the virtual host (empty allows everyone).
    allowed_hosts: []
    websocket:
      enabled: false
      path: /ws
      timeout: 1h
    # Extra location blocks: [{path, config}].
    custom_locations: []
    client_max_body_size: ""
    csp: ""
    # Extra add_header lines.
    headers: []
    # Static files served by nginx under a location, for example a Vite build.
    static:
      enabled: false
      location: /static
      # Directory relative to the release root.
      alias: ""
      # Cache lifetime sent with the files.
      expires: 1h

  postgres:
    # Database name; the section is ignored when empty.
    database: ""
    # Several applications share a database owned by a group role.
    shared: false
    pgvector: false
    # Use the postgresql+asyncpg driver in DATABASE_URL.
    async_db: false
  alembic:
    # Run the migrations of apps/<package>/alembic.ini on every deployment.
    enabled: false
  pg_backup:
    enabled: true
    # Backup directory, <app dir>/backups when empty.
    dir: ""
    hour: "2"
    minute: "0"
    # Days a backup is kept.
    retention: 7
    # custom, plain or tar.
    format: custom

  # Generate OAUTH2_ISSUER, OAUTH2_CLIENT_ID, OAUTH2_SWAGGER_CLIENT_ID and
  # OAUTH2_FRONTEND_CLIENT_ID from website_oauth2_issuer and
  # website_oauth2_clients.<app>.
  oauth2:
    enabled: false

  # Environment file content, merged over the generated variables.
  env_vars: {}
  # Names of secrets that must be provided through website_secrets.
  secret_names: []
  # Names of secrets that are deployed only when provided.
  optional_secret_names: []

  fail2ban:
    enabled: false
    # Each route: {path, method, maxretry, findtime, bantime}.
    routes: []
  hardening:
    enabled: true
    # Extra writable paths of the unit.
    read_write_paths: []
  logrotate:
    enabled: true
    frequency: daily
    rotate: 14
    max_size: 100M
    compress: true
    delay_compress: true
    missing_ok: true
    not_if_empty: true
  # Create the SNS topics and SES notifications that feed a webhook:
  # {region, identity, topic_prefix, endpoint, track_deliveries,
  #  configuration_set, event_types}. The section is ignored when empty.
  ses_webhook: {}
