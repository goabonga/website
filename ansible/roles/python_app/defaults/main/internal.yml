# Settings of the internal application. The OAuth client of the application
# (website_oauth2_clients.internal, client credentials) must hold, at the
# authentication server:
#   billing   billing:platform:read, billing:platform:write and the admin scope of billing
#             (website_billing_partition_admin_scope), otherwise it only sees the SaaS
#             applications it is bound to and cannot create one or manage bindings;
#   mailler   mailler:read, mailler:write, mailler:send, mailler:stats and the admin scope of
#             mailler (ADMIN_SCOPE, mailler:admin by default), otherwise it only sees its own
#             data. The client must also be registered in mailler (website_mailler_clients).

# Base URL of the billing API (BILLING_API_URL), required. The application
# reaches the service through its socket when BILLING_SOCKET_PATH is set, and
# still needs the URL.
website_internal_billing_api_url: "https://{{ website_hostnames.billing }}"

# Base URL of the mailler API (MAILLER_API_URL), required.
website_internal_mailler_api_url: "https://{{ website_hostnames.mailler }}"
