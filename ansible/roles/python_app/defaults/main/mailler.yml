# Settings of the mailler application. The service refuses every caller that
# is not registered (website_mailler_clients) and has no default for the
# settings below: an empty value is neutral (nothing allowed, nothing sent).

# Celery queue of the three processes (CELERY_QUEUE); the worker consumes it
# (--queues), the API and beat publish to it.
website_mailler_celery_queue: mailler

# OAuth2 client that owns the data created before the client registry existed
# (LEGACY_CLIENT_ID). Required only when the database already holds templates,
# contacts, groups or campaigns: migration 006 stops with an explanation when
# it is empty. Not needed on a new database.
website_mailler_legacy_client_id: ""

# Scope that lets a caller cross the client boundary and register clients
# (ADMIN_SCOPE). Give it only to the operator clients, for example the one of
# the internal application, which requests it (website_internal_mailler_admin_scope).
website_mailler_admin_scope: mailler:admin

# Browser origins allowed to call the API (CORS_ORIGINS). Empty allows none.
website_mailler_cors_origins: []

# Public base URL of the API including /api/v1, used to build the unsubscribe
# links of the campaigns (UNSUBSCRIBE_BASE_URL). Required to send campaigns.
website_mailler_unsubscribe_base_url: ""

# Protonmail Bridge (SMTP) provider: PROTONMAIL_HOST, PROTONMAIL_PORT and
# PROTONMAIL_USER are required as soon as the PROTONMAIL_PASSWORD secret is
# provided for mailler. The host and the port follow the protonmail_bridge role.
website_mailler_protonmail_host: "{{ protonmail_bridge_smtp_host | default('') }}"
website_mailler_protonmail_port: "{{ protonmail_bridge_smtp_port | default(0) }}"
website_mailler_protonmail_user: ""

# AWS SES region (SES_REGION), required as soon as the SES_ACCESS_KEY secret is
# provided for mailler.
website_mailler_ses_region: ""

# Applications allowed to send through mailler (the client registry). Each
# OAuth2 client an application sends with must be registered, otherwise every
# call answers 403. A missing client is registered after the migrations; an
# existing one is never modified (use `mailler clients update`). Each entry:
#   client_id            OAuth2 client of the application (required)
#   name                 display name
#   from_email           default sender address
#   from_name            default sender name
#   reply_to             fixed reply-to address
#   allowed_senders      other sender identities, each "email" or "email=Name"
#   allowed_providers    providers the client may use
#   default_provider     provider used when a request names none
#   rate_limit_per_minute, daily_quota   sending limits
#   callback_url         URL notified of the status of the emails
#   callback_secret      secret signing the notifications, required with
#                        callback_url (keep it in the vault)
website_mailler_clients: []

# Directories of <slug>.mjml and <slug>.json files imported as the templates of
# a client after the clients are registered, on every run (an existing template
# is updated). The directory is a path on the host, or the directory printed by
# a module of the application that owns the templates, so that it always
# follows the release in use. Each entry:
#   client_id   client that owns the templates (required)
#   directory   path of the directory on the host
#   app         catalog application that owns the templates, instead of the
#               directory (for example knowledge); it must be deployed before
#               mailler in website_apps_enabled (the first time)
#   module      with app, module run with the Python of that application as
#               `python -m <module>` that prints the directory
#               (knowledge.email_templates for knowledge)
#   status      status of the templates that do not state one (active by default)
website_mailler_template_dirs: []

# Provider the applications that send through mailler ask for (the
# MAILLER_PROVIDER setting of auth and apt_server, and
# MAILLER_DEFAULT_PROVIDER of internal). It must be one the registered client
# of the application may use (allowed_providers or default_provider). The
# value is the default of those applications.
website_mailler_provider: brevo
