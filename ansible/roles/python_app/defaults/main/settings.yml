# ---------------------------------------------------------------------------
# Application selection
# ---------------------------------------------------------------------------

# Applications to deploy, by catalog application name (for example auth,
# backend, frontend). An application brings every component of the catalog
# that belongs to it (web service, worker, beat, scripts).
website_apps_enabled: []

# Optional subset of website_apps_enabled to deploy on this run. Empty means
# every enabled application.
website_apps_limit: []

# Deep-merged over the catalog, keyed by component (auth, auth_worker, ...).
# Use it to pin a version, change a setting or define extra components.
website_apps_overrides: {}

# ---------------------------------------------------------------------------
# Source of the applications
# ---------------------------------------------------------------------------

# Git URL of the monorepo. Applications are deployed from this repository;
# nothing is published to PyPI or built as a Debian package.
website_repo_url: "https://github.com/goabonga/website.git"

# Branch, tag or commit deployed by default. Pin one application with
# website_apps_overrides.<application>.version.
website_repo_version: main

# Access token for a private repository (HTTPS). Empty for a public one.
website_repo_token: ""

# Directory holding the shared clone of the monorepo and the uv installation.
website_state_dir: /var/lib/website

# Parent of the per-application directories (<base>/<name>).
website_base_dir: /opt

# Number of releases kept on disk per application.
website_keep_releases: 3

# ---------------------------------------------------------------------------
# Python and uv
# ---------------------------------------------------------------------------

# uv installation: pip installs it in a dedicated virtualenv under
# website_state_dir, none uses the binary found at website_uv_bin.
website_uv_install_method: pip

# uv version installed with the pip method (empty installs the latest).
website_uv_version: ""

# Path of the uv binary.
website_uv_bin: "{{ website_state_dir }}/tools/bin/uv"

# Python interpreter handed to uv (empty lets uv pick one matching the
# requires-python of the project).
website_python_version: ""

# Python selection policy of uv: system, managed, only-system or only-managed
# (UV_PYTHON_PREFERENCE).
website_uv_python_preference: system

# Distribution packages needed to build and run the applications.
website_system_packages:
  - git
  - python3
  - python3-venv
  - curl
  - zstd

# How Node.js is installed when a component sets build_node: apt, nodesource or
# none.
website_node_install_method: apt

# Major Node.js version installed by the nodesource method.
website_node_version: "20"

# ---------------------------------------------------------------------------
# Runtime behaviour
# ---------------------------------------------------------------------------

# Apply systemd hardening to every unit (per-component override available).
website_hardening_enabled: true

# Fail when a required secret is missing instead of deploying without it.
website_secrets_required: true

# Secrets, keyed by application or component name then by variable name:
#   website_secrets: {auth: {JWKS_ENCRYPTION_KEY: <value from a vault>}}
# Component-level entries win over application-level ones. The values are
# stored as encrypted systemd credentials and never written to the
# environment file.
website_secrets: {}

# Directory holding the encrypted systemd credentials.
website_credstore_dir: /etc/credstore.encrypted

# Name of the group that owns the Redis socket.
website_redis_group: redis

# ---------------------------------------------------------------------------
# Neighbouring services
# ---------------------------------------------------------------------------

# Redis Unix socket (follows the redis role); an empty value selects TCP.
website_redis_socket: "{{ redis_socket | default('') }}"
website_redis_host: 127.0.0.1
website_redis_port: 6379
website_redis_password: ""

# Redis URL for clients that accept the unix:// scheme.
website_redis_url: >-
  {{ 'unix://' ~ website_redis_socket
     if website_redis_socket | length > 0
     else 'redis://' ~ (':' ~ website_redis_password ~ '@' if website_redis_password | length > 0 else '')
          ~ website_redis_host ~ ':' ~ website_redis_port }}

# Redis URL for Celery, which needs the redis+socket:// scheme.
website_celery_redis_url: >-
  {{ 'redis+socket://' ~ website_redis_socket
     if website_redis_socket | length > 0
     else website_redis_url }}

# Celery broker and result backend (Redis databases 0 and 1).
website_celery_broker_url: "{{ website_celery_redis_url ~ '?db=0' if website_redis_socket | length > 0 else website_redis_url ~ '/0' }}"
website_celery_result_backend: "{{ website_celery_redis_url ~ '?db=1' if website_redis_socket | length > 0 else website_redis_url ~ '/1' }}"

# SMTP settings handed to the applications that send mail directly.
website_smtp_host: localhost
website_smtp_port: "587"
website_smtp_tls: "true"

# Issuer shared by every application that validates tokens.
website_oauth2_issuer: "https://{{ website_hostnames.auth }}"

# OAuth2 client identifiers, keyed by application, for the components that set
# oauth2.enabled:
#   website_oauth2_clients:
#     backend: {client_id: "...", swagger_client_id: "..."}
website_oauth2_clients: {}

# ---------------------------------------------------------------------------
# Databases and migrations
# ---------------------------------------------------------------------------

# Name of the group that owns the PostgreSQL socket.
website_postgres_group: postgres

# Directory of the PostgreSQL Unix socket (follows the postgres role).
website_postgres_socket_dir: "{{ postgres_socket_dir | default('/var/run/postgresql') }}"

# Create the PostgreSQL roles and databases declared by the components. The
# postgres role (or an existing server) must be in place.
website_manage_databases: true

# Run `alembic upgrade head` for the components that enable alembic.
website_run_migrations: true

# ---------------------------------------------------------------------------
# Web front
# ---------------------------------------------------------------------------

# Address nginx listens on for public virtual hosts (empty listens on every
# address).
website_listen_ipv4: "{{ (ansible_facts.get('default_ipv4') or {}).get('address', '') }}"
website_listen_ipv6: "{{ (ansible_facts.get('default_ipv6') or {}).get('address', '') }}"

# Address internal virtual hosts (zone website_internal_domain) listen on.
website_internal_listen: 127.0.0.1

# Networks allowed to reach the internal virtual hosts (empty allows every
# client that can reach website_internal_listen). A component overrides it with
# nginx.allowed_hosts.
website_internal_allowed_hosts: []

# Contact address for Let's Encrypt (admin@<domain> when empty).
website_certbot_email: ""

# Webroot used for the ACME HTTP-01 challenges.
website_acme_webroot: /var/www/html

# ACME directory and root certificate of the internal CA used by the virtual
# hosts with ssl: step-ca.
website_step_ca_acme_url: "https://step-ca.{{ website_internal_domain }}/acme/acme/directory"
website_step_ca_root: /etc/step-ca/certs/root_ca.crt

# Directory of the Let's Encrypt certificates.
website_letsencrypt_dir: /etc/letsencrypt

# nginx snippet with custom error pages, included only when the file exists.
website_nginx_error_pages_snippet: /etc/nginx/snippets/error-pages.conf

# TLS settings of the virtual hosts.
website_nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
website_nginx_ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Directories of the dnsmasq instances that resolve internal host names. The
# second one is optional and only used when it exists.
website_dnsmasq_dir: /etc/dnsmasq.d
website_dnsmasq_vpn_dir: /etc/dnsmasq-vpn.d

# Route 53 credentials for wildcard certificates (ssl_dns_provider route53).
website_aws_route53_access_key_id: ""
website_aws_route53_secret_access_key: ""

# ---------------------------------------------------------------------------
# AWS SES
# ---------------------------------------------------------------------------

# AWS credentials for the SES/SNS webhook configuration of the components that
# set ses_webhook. When empty the AWS CLI uses its own credential chain.
website_aws_ses_access_key_id: ""
website_aws_ses_secret_access_key: ""
website_aws_ses_region: ""

# ---------------------------------------------------------------------------
# OpenVPN hooks
# ---------------------------------------------------------------------------

# Configuration file of the OpenVPN server that calls the hook scripts of the
# script components (follows the openvpn role).
website_openvpn_server_conf: "{{ openvpn_config_dir | default('/etc/openvpn/server') }}/{{ openvpn_server_name | default('server') }}.conf"

# systemd unit of that server.
website_openvpn_service: "openvpn-server@{{ openvpn_server_name | default('server') }}"

# Directory of the AppArmor local overrides.
website_apparmor_local_dir: /etc/apparmor.d/local

# ---------------------------------------------------------------------------
# Asterisk
# ---------------------------------------------------------------------------

# Configuration directory and account of Asterisk (follow the asterisk role).
website_asterisk_config_dir: "{{ asterisk_config_dir | default('/etc/asterisk') }}"
website_asterisk_user: "{{ asterisk_user | default('asterisk') }}"
website_asterisk_group: "{{ asterisk_group | default('asterisk') }}"

