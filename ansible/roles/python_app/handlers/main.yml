- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  listen: python_app | reload nginx

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  listen: python_app | restart nginx

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
  listen: python_app | restart dnsmasq

- name: Restart dnsmasq-vpn
  ansible.builtin.systemd:
    name: dnsmasq-vpn
    state: restarted
  listen: python_app | restart dnsmasq-vpn

