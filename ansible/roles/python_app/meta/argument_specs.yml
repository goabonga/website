# Copyright (c) 2026 Chris <goabonga@pm.me>
argument_specs:
  main:
    short_description: Deploy the platform applications from the monorepo with uv and systemd.
    description:
    - Checks out the monorepo, installs each selected application into its own virtualenv
      with uv and renders its environment file, encrypted credentials and systemd units, and
      optionally sets up the PostgreSQL database and migrations, an nginx virtual host with
      its certificate, fail2ban rate limits, the Asterisk dialplan, wrapper scripts and OpenVPN
      hooks and AWS SES notifications. Applications are described by a catalog of components
      that is merged with the user overrides.
    author: Chris
    options:
      website_apps_catalog:
        type: dict
        description:
        - 'Optional behaviours that need an operator decision are off by default, for example
          the wildcard certificate of the multi-tenant applications (auth and knowledge):
          enable it with nginx.ssl_wildcard, nginx.ssl_wildcard_domains and nginx.ssl_dns_provider
          in website_apps_overrides.'
      python_app_component_defaults:
        type: dict
        description:
        - 'Every catalog entry is a component: one systemd unit (or one set of wrapper scripts)
          of an application. The catalog entry and the matching website_apps_overrides entry
          are deep-merged over these defaults, so a component only states what differs.'
        default:
          enabled: true
          app: ''
          primary: false
          name: ''
          module: ''
          package: ''
          type: gunicorn
          version: ''
          user: ''
          group: ''
          extra_groups: []
          extra_path: []
          sudoers: []
          stepca_group_member: false
          custom_domain_helper:
            enabled: false
          healthcheck:
            enabled: false
            path: /health
            timeout: 10
          gunicorn:
            workers: 2
            socket: true
            host: 127.0.0.1
            port: 8000
            module: ''
            worker_class: uvicorn.workers.UvicornWorker
          celery:
            app: ''
            loglevel: info
            concurrency: 2
            queues: []
            scheduler: ''
          daemon:
            module: ''
            args: ''
            stop_timeout: 30
          fastagi:
            module: ''
            host: 127.0.0.1
            port: 4573
            agi_script: bot
          audiosocket:
            module: ''
            host: 127.0.0.1
            port: 9092
          asterisk:
            enabled: false
            context: fastagi-bot
            test_extension: ''
          script:
            wrappers: []
          openvpn: {}
          build_commands: []
          build_chdir: ''
          build_node: false
          nginx:
            enabled: false
            domain: ''
            ssl: letsencrypt
            ssl_wildcard: false
            ssl_wildcard_domains: []
            ssl_dns_provider: manual
            dns_wildcard_cname_target: ''
            redirect_domains: []
            internal_domain: false
            allowed_hosts: []
            websocket:
              enabled: false
              path: /ws
              timeout: 1h
            custom_locations: []
            webhook_paths: []
            client_max_body_size: ''
            csp: ''
            headers: []
            static:
              enabled: false
              location: /static
              alias: ''
              expires: 1h
          postgres:
            database: ''
            shared: false
            pgvector: false
            async_db: false
          alembic:
            enabled: false
          pg_backup:
            enabled: true
            dir: ''
            hour: '2'
            minute: '0'
            retention: 7
            format: custom
          oauth2:
            enabled: false
          env_defaults: {}
          env_vars: {}
          secret_names: []
          optional_secret_names: []
          fail2ban:
            enabled: false
            routes: []
          hardening:
            enabled: true
            read_write_paths: []
          logrotate:
            enabled: true
            frequency: daily
            rotate: 14
            max_size: 100M
            compress: true
            delay_compress: true
            missing_ok: true
            not_if_empty: true
          ses_webhook: {}
          auth_catalog:
            scopes: []
            roles: []
            clients: []
            scope_groups: {}
      website_domain:
        type: str
        description:
        - 'Public DNS zone the applications are served under. There is no default: deploying
          an application with a public virtual host fails until it is set.'
        default: ''
      website_internal_domain:
        type: str
        description:
        - Zone suffix of the applications that are only reachable internally.
        default: internal
      website_internal_apps:
        type: list
        description:
        - Applications served under website_internal_domain instead of website_domain.
        default:
        - billing
        - custom_domain
        - internal
        - mailler
        - reachy_mini_api
        - team
        elements: str
      website_subdomains_defaults:
        type: dict
        description:
        - Label prepended to the zone for each application. An empty label serves the application
          on the bare zone. Override single entries with website_subdomains_overrides.
        default:
          analytics: ua
          apt_server: apt
          auth: auth
          backend: api
          billing: billing
          custom_domain: custom-domain
          frontend: ''
          internal: admin
          knowledge: knowledge
          mailler: mailler
          mta_sts: mta-sts
          reachy_mini_api: reachy
          team: team
          vpn_portal: vpn
          webhooks: webhooks
      website_subdomains_overrides:
        type: dict
        description:
        - Labels merged over website_subdomains_defaults.
        default: {}
      website_subdomains:
        type: dict
        description:
        - Labels in effect.
      website_hostnames_overrides:
        type: dict
        description:
        - Complete host names that replace the derived ones, keyed by application.
        default: {}
      website_hostnames:
        type: dict
        description:
        - 'Host name of each application: the label in front of the zone, or the bare zone
          for an empty label. The name is empty while the zone is empty, and the applications
          without an entry in website_subdomains (asterisk) have none.'
      website_apps_enabled:
        type: list
        description:
        - Applications to deploy, by catalog application name (for example auth, backend,
          frontend). An application brings every component of the catalog that belongs to
          it (web service, worker, beat, scripts).
        default: []
        elements: str
      website_apps_limit:
        type: list
        description:
        - Optional subset of website_apps_enabled to deploy on this run. Empty means every
          enabled application.
        default: []
        elements: str
      website_apps_overrides:
        type: dict
        description:
        - Deep-merged over the catalog, keyed by component (auth, auth_worker, ...). Use it
          to pin a version, change a setting or define extra components.
        default: {}
      website_apps_pins:
        type: dict
        description:
        - Release of each application to deploy, keyed by application (the primary component),
          for example auth mapped to auth-v1.2.0. It takes precedence over a version set in
          website_apps_overrides and is written by the deployment workflow.
        default: {}
      website_repo_url:
        type: str
        description:
        - Git URL of the monorepo. Applications are deployed from this repository; nothing
          is published to PyPI or built as a Debian package.
        default: https://github.com/goabonga/website.git
      website_repo_version:
        type: str
        description:
        - Branch, tag or commit deployed by default. Pin one application with website_apps_overrides.<application>.version.
        default: main
      website_repo_token:
        type: str
        description:
        - Access token for a private repository (HTTPS). Empty for a public one.
        default: ''
      website_state_dir:
        type: str
        description:
        - Directory holding the shared clone of the monorepo and the uv installation.
        default: /var/lib/website
      website_base_dir:
        type: str
        description:
        - Parent of the per-application directories (<base>/<name>).
        default: /opt
      website_keep_releases:
        type: int
        description:
        - Number of releases kept on disk per application.
        default: 3
      website_uv_install_method:
        type: str
        description:
        - 'uv installation: pip installs it in a dedicated virtualenv under website_state_dir,
          none uses the binary found at website_uv_bin.'
        default: pip
        choices:
        - pip
        - none
      website_uv_version:
        type: str
        description:
        - uv version installed with the pip method (empty installs the latest).
        default: ''
      website_uv_bin:
        type: str
        description:
        - Path of the uv binary.
      website_python_version:
        type: str
        description:
        - Python interpreter handed to uv (empty lets uv pick one matching the requires-python
          of the project).
        default: ''
      website_uv_python_preference:
        type: str
        description:
        - 'Python selection policy of uv: system, managed, only-system or only-managed (UV_PYTHON_PREFERENCE).'
        default: system
        choices:
        - system
        - managed
        - only-system
        - only-managed
      website_system_packages:
        type: list
        description:
        - Distribution packages needed to build and run the applications.
        default:
        - git
        - python3
        - python3-venv
        - curl
        - zstd
        elements: str
      website_node_install_method:
        type: str
        description:
        - 'How Node.js is installed when a component sets build_node: apt, nodesource or none.'
        default: apt
        choices:
        - apt
        - nodesource
        - none
      website_node_version:
        type: str
        description:
        - Major Node.js version installed by the nodesource method.
        default: '20'
      website_hardening_enabled:
        type: bool
        description:
        - Apply systemd hardening to every unit (per-component override available).
        default: true
      website_secrets_required:
        type: bool
        description:
        - Fail when a required secret is missing instead of deploying without it.
        default: true
      website_secrets:
        type: dict
        description:
        - 'Secrets, keyed by application or component name then by variable name: website_secrets:
          {auth: {JWKS_ENCRYPTION_KEY: <value from a vault>}} Component-level entries win
          over application-level ones. The values are stored as encrypted systemd credentials
          and never written to the environment file.'
        default: {}
      website_credstore_dir:
        type: str
        description:
        - Directory holding the encrypted systemd credentials.
        default: /etc/credstore.encrypted
      website_redis_group:
        type: str
        description:
        - Name of the group that owns the Redis socket.
        default: redis
      website_redis_socket:
        type: str
        description:
        - Redis Unix socket (follows the redis role); an empty value selects TCP.
      website_redis_host:
        type: str
        description:
        - Redis host, used when there is no socket.
        default: 127.0.0.1
      website_redis_port:
        type: int
        description:
        - Redis TCP port, used when there is no socket.
        default: 6379
      website_redis_password:
        type: str
        description:
        - Redis password, used when there is no socket (empty for none).
        default: ''
      website_redis_url:
        type: str
        description:
        - Redis URL for clients that accept the unix:// scheme.
      website_celery_redis_url:
        type: str
        description:
        - Redis URL for Celery, which needs the redis+socket:// scheme.
      website_celery_broker_url:
        type: str
        description:
        - Celery broker (Redis database 0).
      website_celery_result_backend:
        type: str
        description:
        - Celery result backend.
      website_smtp_host:
        type: str
        description:
        - SMTP host handed to the applications that send mail directly.
        default: localhost
      website_smtp_port:
        type: str
        description:
        - SMTP port.
        default: '587'
      website_smtp_tls:
        type: str
        description:
        - Use TLS for SMTP ("true" or "false").
        default: 'true'
      website_oauth2_issuer:
        type: str
        description:
        - Issuer shared by every application that validates tokens.
      website_oauth2_clients:
        type: dict
        description:
        - 'OAuth2 client identifiers, keyed by application, for the components that set oauth2.enabled:
          website_oauth2_clients: backend: {client_id: "...", swagger_client_id: "..."}'
        default: {}
      website_postgres_group:
        type: str
        description:
        - Name of the group that owns the PostgreSQL socket.
        default: postgres
      website_postgres_socket_dir:
        type: str
        description:
        - Directory of the PostgreSQL Unix socket (follows the postgres role).
      website_manage_databases:
        type: bool
        description:
        - Create the PostgreSQL roles and databases declared by the components. The postgres
          role (or an existing server) must be in place.
        default: true
      website_run_migrations:
        type: bool
        description:
        - Run `alembic upgrade head` for the components that enable alembic.
        default: true
      website_listen_ipv4:
        type: str
        description:
        - IPv4 address nginx listens on for public virtual hosts (empty listens on every address).
      website_listen_ipv6:
        type: str
        description:
        - IPv6 address nginx listens on for public virtual hosts (empty for none).
      website_internal_listen:
        type: str
        description:
        - Address internal virtual hosts (zone website_internal_domain) listen on.
        default: 127.0.0.1
      website_internal_allowed_hosts:
        type: list
        description:
        - Networks allowed to reach the internal virtual hosts (empty allows every client
          that can reach website_internal_listen). A component overrides it with nginx.allowed_hosts.
        default: []
        elements: str
      website_certbot_email:
        type: str
        description:
        - Contact address for Let's Encrypt (admin@<domain> when empty).
        default: ''
      website_acme_webroot:
        type: str
        description:
        - Webroot used for the ACME HTTP-01 challenges.
        default: /var/www/html
      website_step_ca_acme_url:
        type: str
        description:
        - 'ACME directory of the internal CA used by the virtual hosts with ssl: step-ca.'
      website_step_ca_root:
        type: str
        description:
        - Root certificate of that CA.
        default: /etc/step-ca/certs/root_ca.crt
      website_letsencrypt_dir:
        type: str
        description:
        - Directory of the Let's Encrypt certificates.
        default: /etc/letsencrypt
      website_nginx_error_pages_snippet:
        type: str
        description:
        - nginx snippet with custom error pages, included only when the file exists.
        default: /etc/nginx/snippets/error-pages.conf
      website_nginx_ssl_protocols:
        type: str
        description:
        - TLS protocols of the virtual hosts.
        default: TLSv1.2 TLSv1.3
      website_nginx_ssl_ciphers:
        type: str
        description:
        - TLS ciphers of the virtual hosts.
        default: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
      website_dnsmasq_dir:
        type: str
        description:
        - Configuration directory of the dnsmasq instance that resolves internal host names
          on the host.
        default: /etc/dnsmasq.d
      website_dnsmasq_vpn_dir:
        type: str
        description:
        - Configuration directory of the dnsmasq instance that serves the VPN clients, used
          only when it exists.
        default: /etc/dnsmasq-vpn.d
      website_aws_route53_access_key_id:
        type: str
        description:
        - Route 53 access key id for wildcard certificates (ssl_dns_provider route53).
        default: ''
      website_aws_route53_secret_access_key:
        type: str
        description:
        - Route 53 secret access key for wildcard certificates.
        default: ''
      website_aws_ses_access_key_id:
        type: str
        description:
        - AWS access key id for the SES/SNS webhook configuration of the components that set
          ses_webhook. When empty the AWS CLI uses its own credential chain.
        default: ''
      website_aws_ses_secret_access_key:
        type: str
        description:
        - AWS secret access key for the SES/SNS configuration.
        default: ''
      website_openvpn_server_conf:
        type: str
        description:
        - Configuration file of the OpenVPN server that calls the hook scripts of the script
          components (follows the openvpn role).
      website_openvpn_service:
        type: str
        description:
        - systemd unit of that server.
      website_apparmor_local_dir:
        type: str
        description:
        - Directory of the AppArmor local overrides.
        default: /etc/apparmor.d/local
      website_asterisk_config_dir:
        type: str
        description:
        - Configuration directory of Asterisk (follows the asterisk role).
      website_asterisk_user:
        type: str
        description:
        - Account that owns the Asterisk configuration (follows the asterisk role).
      website_asterisk_group:
        type: str
        description:
        - Group that owns the Asterisk configuration (follows the asterisk role).
      website_custom_domain_celery_queue:
        type: str
        description:
        - Celery queue of the three custom_domain processes (CELERY_QUEUE); the worker consumes it
          (--queues), the API and beat publish to it.
        default: custom-domain
      website_custom_domain_cname_target:
        type: str
        description:
        - Default CNAME target handed to the customers (DEFAULT_CNAME_TARGET of the API). Empty
          means every authorized client must carry its own.
        default: ''
      website_custom_domain_helper:
        type: str
        description:
        - Where the privileged helper is installed (PRIVILEGED_HELPER). Owned by root and not
          writable by anyone else.
        default: /usr/local/sbin/custom-domain-privileged
      website_custom_domain_staging_dir:
        type: str
        description:
        - Directory the worker stages the rendered virtual hosts in, read back by the helper
          (PRIVILEGED_STAGING_DIR).
        default: /var/lib/custom-domain/staging
      website_custom_domain_sites_dir:
        type: str
        description:
        - nginx directory receiving the virtual hosts of the customers (NGINX_SITES_DIR).
        default: /etc/nginx/sites-enabled
      website_custom_domain_config_prefix:
        type: str
        description:
        - Prefix of the file names written in that directory (NGINX_CONFIG_PREFIX).
        default: custom-domain-
      website_custom_domain_nginx_bin:
        type: str
        description:
        - nginx binary (NGINX_BIN), owned by root and not writable by others.
        default: /usr/sbin/nginx
      website_custom_domain_systemctl_bin:
        type: str
        description:
        - systemctl binary (SYSTEMCTL_BIN), owned by root and not writable by others.
        default: /usr/bin/systemctl
      website_custom_domain_certbot_bin:
        type: str
        description:
        - certbot binary (CERTBOT_BIN), owned by root and not writable by others.
        default: /usr/bin/certbot
      website_custom_domain_openssl_bin:
        type: str
        description:
        - openssl binary (OPENSSL_BIN), owned by root and not writable by others.
        default: /usr/bin/openssl
      website_custom_domain_nginx_service:
        type: str
        description:
        - systemd unit reloaded after a change (NGINX_SERVICE).
        default: nginx
      website_custom_domain_webroot:
        type: str
        description:
        - Webroot of the HTTP-01 challenge (CERTBOT_WEBROOT). nginx must serve it on /.well-known/acme-challenge/ for the customer domains; it is created when missing.
        default: /var/www/certbot
      website_custom_domain_letsencrypt_dir:
        type: str
        description:
        - Directory of the certificates (LETSENCRYPT_DIR); website_letsencrypt_dir by default.
      website_custom_domain_certbot_email:
        type: str
        description:
        - Contact address of the certificate requests (CERTBOT_EMAIL); website_certbot_email when
          empty. One of the two is required by the worker.
        default: ''
      website_custom_domain_clients:
        type: list
        description:
        - 'Applications allowed to register customer domains, created in the database after the
          migrations when missing and never modified afterwards. Each entry has client_id and name
          (required), and optionally description, upstream (socket path or host:port), cname,
          max_domains, webhook_url and webhook_secret (at least 32 characters, required with
          webhook_url).'
        default: []
        elements: dict
      website_mailler_celery_queue:
        type: str
        description:
        - Celery queue of the three mailler processes (CELERY_QUEUE); the worker consumes it
          (--queues), the API and beat publish to it.
        default: mailler
      website_mailler_legacy_client_id:
        type: str
        description:
        - 'OAuth2 client that owns the data created before the client registry existed
          (LEGACY_CLIENT_ID). Required only when the database already holds templates, contacts,
          groups or campaigns: migration 006 stops with an explanation when it is empty.'
        default: ''
      website_mailler_cors_origins:
        type: list
        description:
        - Browser origins allowed to call the API (CORS_ORIGINS). Empty allows none.
        default: []
        elements: str
      website_mailler_unsubscribe_base_url:
        type: str
        description:
        - Public base URL of the API including /api/v1, used to build the unsubscribe links of the
          campaigns (UNSUBSCRIBE_BASE_URL). Required to send campaigns.
        default: ''
      website_mailler_protonmail_host:
        type: str
        description:
        - Protonmail Bridge SMTP host (PROTONMAIL_HOST); follows the protonmail_bridge role.
          Required, with the port and the user, when the PROTONMAIL_PASSWORD secret is provided.
      website_mailler_protonmail_port:
        type: raw
        description:
        - Protonmail Bridge SMTP port (PROTONMAIL_PORT); follows the protonmail_bridge role, 0
          when it is not used.
      website_mailler_protonmail_user:
        type: str
        description:
        - Protonmail Bridge account (PROTONMAIL_USER).
        default: ''
      website_mailler_ses_region:
        type: str
        description:
        - AWS SES region (SES_REGION). Required when the SES_ACCESS_KEY secret is provided.
        default: ''
      website_mailler_clients:
        type: list
        description:
        - Applications allowed to send through mailler, registered after the migrations when
          missing and never modified afterwards. Each entry has client_id (required) and
          optionally name, from_email, from_name, reply_to, allowed_senders (email or email=Name),
          allowed_providers, default_provider, rate_limit_per_minute, daily_quota, callback_url
          and callback_secret (required with callback_url).
        default: []
        elements: dict
      website_mailler_template_dirs:
        type: list
        description:
        - Directories of <slug>.mjml and <slug>.json files imported as the templates of a client
          on every run. Each entry has client_id and either directory (a path on the host) or app
          (a catalog application, deployed before mailler) and module (run with the Python of that
          application, it prints the directory), and optionally status.
        default: []
        elements: dict
      website_billing_celery_queue:
        type: str
        description:
        - Celery queue of the three billing processes (CELERY_QUEUE); the worker consumes it
          (--queues), the API and beat publish to it.
        default: billing
      website_billing_shared_env:
        type: dict
        description:
        - Settings the API, worker and beat units of billing must share (CELERY_TIMEZONE,
          CELERY_TASK_TIME_LIMIT, USAGE_REPORT_INTERVAL, USAGE_REPORT_BATCH_SIZE,
          USAGE_CLEANUP_INTERVAL, USAGE_RETENTION_DAYS, STRIPE_SYNC_INTERVAL and the
          SAAS_WEBHOOK_* delivery settings). The worker delivers the notifications to the webhook
          URL of each SaaS application, so its host must be able to reach them.
        default: {}
      website_billing_partition_admin_scope:
        type: str
        description:
        - Scope that lets a client act on every SaaS application and manage the bindings
          (PARTITION_ADMIN_SCOPE). Give it only to the operator clients.
        default: billing:admin
      website_billing_partition_allow_unbound:
        type: bool
        description:
        - Let an OAuth client without any binding act on every SaaS application
          (PARTITION_ALLOW_UNBOUND). Transition aid for the first deployment only.
        default: false
      website_billing_plans_public:
        type: bool
        description:
        - Serve GET /plans/<slug> without a token (PLANS_PUBLIC).
        default: false
      website_billing_redirect_allowlist_required:
        type: bool
        description:
        - Refuse checkout and portal redirect URLs while a SaaS application lists no allowed
          prefix (REDIRECT_ALLOWLIST_REQUIRED).
        default: true
      website_billing_stripe_webhook_required_scope:
        type: str
        description:
        - 'Scope a bearer token must also carry to post a Stripe event
          (STRIPE_WEBHOOK_REQUIRED_SCOPE). Empty: the Stripe signature is the only authentication
          of /webhooks/stripe.'
        default: ''
      website_billing_stripe_publishable_key:
        type: str
        description:
        - Stripe publishable key (STRIPE_PUBLISHABLE_KEY). Public, not a secret.
        default: ''
      website_billing_cors_origins:
        type: list
        description:
        - Browser origins allowed to call the API (CORS_ORIGINS). Empty allows none.
        default: []
        elements: str
      website_billing_saas_apps:
        type: list
        description:
        - SaaS applications created in the database after the migrations when missing, never
          modified afterwards. Each entry has slug and name (required) and optionally description,
          webhook_url and checkout_urls (allowed redirect prefixes).
        default: []
        elements: dict
      website_billing_client_bindings:
        type: list
        description:
        - Bindings of existing OAuth clients to SaaS applications, created when missing. Each
          entry has saas (slug of an existing application) and client_id.
        default: []
        elements: dict
      website_mailler_provider:
        type: str
        description:
        - Provider the applications that send through mailler ask for (MAILLER_PROVIDER of auth and
          apt_server, MAILLER_DEFAULT_PROVIDER of internal). It must be one the
          registered client of the application may use.
        default: brevo
      website_internal_billing_api_url:
        type: str
        description:
        - Base URL of the billing API (BILLING_API_URL of internal), required; the host name of
          billing by default.
      website_internal_mailler_api_url:
        type: str
        description:
        - Base URL of the mailler API (MAILLER_API_URL of internal), required; the host name of
          mailler by default.
      website_knowledge_celery_queue:
        type: str
        description:
        - Celery queue of the three knowledge processes (CELERY_QUEUE); the worker consumes it
          (--queues), the API and beat publish to it.
        default: knowledge
      website_knowledge_celery_timezone:
        type: str
        description:
        - Time zone of the Celery schedule of the three knowledge processes (CELERY_TIMEZONE).
        default: UTC
      website_knowledge_billing_saas_id:
        type: str
        description:
        - Identifier of the SaaS application of knowledge in billing (BILLING_SAAS_ID),
          returned by billing when it creates the application. Billing is not used while it is
          empty.
        default: ''
      website_knowledge_billing_app_slug:
        type: str
        description:
        - Slug of the SaaS application of knowledge in billing (BILLING_APP_SLUG), the one of
          the entry of website_billing_saas_apps.
        default: ''
      website_knowledge_billing_checkout_success_url:
        type: str
        description:
        - Where Stripe sends the customer back after a checkout
          (BILLING_CHECKOUT_SUCCESS_URL). Must be covered by the checkout_urls of the SaaS
          application; required with website_knowledge_billing_saas_id.
        default: ''
      website_knowledge_billing_checkout_cancel_url:
        type: str
        description:
        - Where Stripe sends the customer back when a checkout is cancelled
          (BILLING_CHECKOUT_CANCEL_URL). Must be covered by the checkout_urls of the SaaS
          application; required with website_knowledge_billing_saas_id.
        default: ''
      website_knowledge_quota_fallback_limits:
        type: dict
        description:
        - Limits applied while billing cannot answer (QUOTA_FALLBACK_LIMITS), by plan slug;
          the key * applies to every other plan, a limit that is not listed is 0 and -1 is
          unlimited.
        default: {}
      website_knowledge_custom_domain_cname_target:
        type: str
        description:
        - CNAME target shown to the customers before they register a domain
          (CUSTOM_DOMAIN_CNAME_TARGET); website_custom_domain_cname_target by default.
      website_knowledge_mailler_client_id:
        type: str
        description:
        - OAuth2 client of the calls of knowledge to mailler (MAILLER_CLIENT_ID). Empty uses
          the client of the application, with the OAUTH2_CLIENT_SECRET secret.
        default: ''
      website_knowledge_custom_domain_client_id:
        type: str
        description:
        - OAuth2 client of the calls of knowledge to custom_domain (CUSTOM_DOMAIN_CLIENT_ID).
          Empty uses the client of the application.
        default: ''
      website_knowledge_billing_client_id:
        type: str
        description:
        - OAuth2 client of the calls of knowledge to billing (BILLING_CLIENT_ID). Empty uses
          the client of the application.
        default: ''
      website_knowledge_operator_name:
        type: str
        description:
        - Who publishes the service, shown on the legal notice and the pricing page
          (OPERATOR_NAME). An empty value is left out of the pages.
        default: ''
      website_knowledge_contact_email:
        type: str
        description:
        - General contact address of the service (CONTACT_EMAIL).
        default: ''
      website_knowledge_sales_email:
        type: str
        description:
        - Address of the contact sales button of the plans with a custom price (SALES_EMAIL).
        default: ''
      website_knowledge_legal_email:
        type: str
        description:
        - Address of the legal notice and the terms of service (LEGAL_EMAIL).
        default: ''
      website_knowledge_privacy_email:
        type: str
        description:
        - Address of the privacy policy and of the data subject requests (PRIVACY_EMAIL).
        default: ''
      website_knowledge_support_url:
        type: str
        description:
        - Where the customers of a deleted workspace can get help (SUPPORT_URL).
        default: ''
      website_internal_billing_read_scope:
        type: str
        description:
        - Scope of the calls of internal to billing that read (BILLING_READ_SCOPE).
        default: billing:platform:read
      website_internal_billing_write_scope:
        type: str
        description:
        - Scope of the calls of internal to billing that write (BILLING_WRITE_SCOPE).
        default: billing:platform:write
      website_internal_billing_admin_scope:
        type: str
        description:
        - Admin scope internal requests from billing (BILLING_ADMIN_SCOPE); must be the
          PARTITION_ADMIN_SCOPE of billing, which it follows by default.
      website_internal_billing_timeout:
        type: int
        description:
        - Seconds allowed to one request of internal to billing (BILLING_TIMEOUT).
        default: 30
      website_internal_billing_page_size:
        type: int
        description:
        - Rows per page of the customer and subscription lists of internal
          (BILLING_PAGE_SIZE).
        default: 20
      website_internal_billing_recent_limit:
        type: int
        description:
        - Rows of the recent tables of a SaaS application page of internal
          (BILLING_RECENT_LIMIT).
        default: 10
      website_internal_mailler_admin_scope:
        type: str
        description:
        - Admin scope internal requests from mailler (MAILLER_ADMIN_SCOPE); must be the
          ADMIN_SCOPE of mailler, which it follows by default. Empty makes internal an
          ordinary client of mailler.
      website_internal_mailler_timeout:
        type: int
        description:
        - Seconds allowed to one request of internal to mailler (MAILLER_TIMEOUT).
        default: 30
      website_internal_mailler_clients_page_size:
        type: int
        description:
        - Rows per page of the list of mailler clients of internal
          (MAILLER_CLIENTS_PAGE_SIZE).
        default: 20
      website_mailler_admin_scope:
        type: str
        description:
        - Scope that lets a caller cross the client boundary and register clients in mailler
          (ADMIN_SCOPE).
        default: mailler:admin
      website_auth_catalog_file:
        type: str
        description:
        - Path of the catalog file rendered for auth from the auth_catalog declarations of the
          enabled applications (CATALOG_FILE). Its directory must exist and belong to the account
          of auth.
      website_auth_catalog:
        type: dict
        description:
        - 'Scopes, roles and client allowances added to what the enabled applications declare, or
          that replace the fields of a scope they declare. Same shape as the auth_catalog key of a
          component: scopes, roles, clients (added to existing clients; an entry with an empty
          client_id is ignored) and scope_groups (SCOPE_GROUPS of auth). Every key is optional.'
        default: {}
