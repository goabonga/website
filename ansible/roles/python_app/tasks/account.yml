- name: Select the components of the application
  ansible.builtin.import_tasks: context.yml

- name: Create the group of {{ python_app__app }}
  ansible.builtin.group:
    name: "{{ python_app__group }}"
    system: true
    state: present

- name: Look up the account of {{ python_app__app }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ python_app__user }}"
    fail_key: false

# usermod refuses to change the home of an account that runs processes: the
# home is only set when the account is created.
- name: Create the account of {{ python_app__app }}
  ansible.builtin.user:
    name: "{{ python_app__user }}"
    group: "{{ python_app__group }}"
    home: "{{ omit if (ansible_facts.getent_passwd | default({})).get(python_app__user) is not none else python_app__dir }}"
    shell: /bin/bash
    system: true
    create_home: false
    state: present

- name: Create the directory of {{ python_app__app }}
  ansible.builtin.file:
    path: "{{ python_app__dir }}"
    state: directory
    owner: "{{ python_app__user }}"
    group: "{{ python_app__group }}"
    mode: "0755"
