- name: Select the components of the application
  ansible.builtin.import_tasks: context.yml

- name: Create the directories of {{ python_app__app }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ python_app__user }}"
    group: "{{ python_app__group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ python_app__releases_dir }}", mode: "0755" }
    - { path: "{{ python_app__logs_dir }}", mode: "0755" }
    - { path: "{{ python_app__env_dir }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Provision the database of {{ python_app__app }}
  ansible.builtin.include_tasks: database.yml
  when:
    - website_manage_databases | bool
    - python_app__p.postgres.database | length > 0

- name: Deploy the release of {{ python_app__app }}
  ansible.builtin.import_tasks: release.yml

- name: Deploy the components of {{ python_app__app }}
  ansible.builtin.include_tasks: component.yml
  loop: "{{ python_app__comps }}"
  loop_control:
    loop_var: python_app__c
    label: "{{ python_app__c.id }}"
  when: python_app__sha | length > 0

- name: Register the data of {{ python_app__app }}
  ansible.builtin.include_tasks: "onboarding_{{ python_app__app }}.yml"
  when:
    - python_app__app in ['custom_domain', 'mailler', 'billing', 'auth']
    - python_app__sha | length > 0

- name: Configure the log rotation of {{ python_app__app }}
  ansible.builtin.template:
    src: logrotate.j2
    dest: "/etc/logrotate.d/{{ python_app__p.name }}"
    owner: root
    group: root
    mode: "0644"
  when: python_app__p.logrotate.enabled | bool

- name: Remove the log rotation of {{ python_app__app }}
  ansible.builtin.file:
    path: "/etc/logrotate.d/{{ python_app__p.name }}"
    state: absent
  when: not (python_app__p.logrotate.enabled | bool)

- name: Schedule the database backups of {{ python_app__app }}
  ansible.builtin.include_tasks: backup.yml
  when:
    - website_manage_databases | bool
    - python_app__p.postgres.database | length > 0

