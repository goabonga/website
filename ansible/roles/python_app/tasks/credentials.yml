- name: Check that the required secrets of {{ python_app__unit }} are provided
  ansible.builtin.assert:
    that:
      - python_app__secret_value | string | length > 0
    fail_msg: >-
      The secret {{ item }} of {{ python_app__c.id }} is required: set
      website_secrets.{{ python_app__c.id }}.{{ item }} or
      website_secrets.{{ python_app__c.app }}.{{ item }}, or set
      website_secrets_required to false.
    quiet: true
  loop: "{{ python_app__c.secret_names }}"
  when: website_secrets_required | bool
  no_log: true

- name: Create the credential store
  ansible.builtin.file:
    path: "{{ website_credstore_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: python_app__secret_names | length > 0

- name: Encrypt the secrets of {{ python_app__unit }}
  ansible.builtin.shell:
    cmd: |
      set -eu
      current=$(systemd-creds decrypt "$CRED" - 2>/dev/null || true)
      if [ "$current" = "$VALUE" ]; then
        echo unchanged
        exit 0
      fi
      printf %s "$VALUE" | systemd-creds encrypt --name="$NAME" - "$CRED.new"
      mv "$CRED.new" "$CRED"
      echo changed
    executable: /bin/bash
  environment:
    CRED: "{{ website_credstore_dir }}/{{ python_app__unit }}.{{ item }}.cred"
    NAME: "{{ item }}"
    VALUE: "{{ python_app__secret_value }}"
  loop: "{{ python_app__secret_names }}"
  when: python_app__secret_value | string | length > 0
  register: python_app__r_cred
  changed_when: python_app__r_cred.stdout | default('') | trim == 'changed'
  no_log: true

# The secrets without a value are skipped by their condition; in a check run
# the others are skipped too (the shell module does not run), so only the
# condition tells them apart.
- name: Work out the secrets deployed for {{ python_app__unit }}
  ansible.builtin.set_fact:
    python_app__secrets_deployed: >-
      {{ python_app__r_cred.results | default([])
         | rejectattr('false_condition', 'defined')
         | map(attribute='item') | list }}
