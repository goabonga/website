# Internal variables. The facts python_app__all (every merged component),
# python_app__comps (the components of the application being deployed),
# python_app__p (its primary component) and python_app__c (the component being
# deployed) are set by the tasks.

# Applications deployed by this run, in the order of website_apps_enabled.
python_app__apps: >-
  {{ website_apps_enabled
     if website_apps_limit | length == 0
     else website_apps_enabled | select('in', website_apps_limit) | list }}

# Catalog with the overrides applied.
python_app__catalog: "{{ website_apps_catalog | combine(website_apps_overrides, recursive=True) }}"

# Component types the role knows.
python_app__types:
  - gunicorn
  - celery_worker
  - celery_beat
  - daemon
  - audiosocket
  - fastagi
  - script

# Application directory layout, named after the primary component.
python_app__user: "{{ python_app__p.user | default('', true) or python_app__p.name }}"
python_app__group: "{{ python_app__p.group | default('', true) or python_app__user }}"
python_app__dir: "{{ website_base_dir }}/{{ python_app__p.name }}"
python_app__releases_dir: "{{ python_app__dir }}/releases"
python_app__current: "{{ python_app__dir }}/current"
python_app__venv: "{{ python_app__dir }}/venv"
python_app__logs_dir: "{{ python_app__dir }}/logs"
python_app__env_dir: "{{ python_app__dir }}/env"
python_app__bin_dir: "{{ python_app__dir }}/bin"
python_app__app_package: "{{ python_app__p.package | default('', true) or (python_app__p.app | replace('_', '-')) }}"
python_app__version: "{{ python_app__p.version | default('', true) or website_repo_version }}"
python_app__repo_dir: "{{ website_state_dir }}/repo"

# Component being deployed.
python_app__unit: "{{ python_app__c.name }}"
python_app__env_file: "{{ python_app__env_dir }}/{{ python_app__unit }}.env"
python_app__module: "{{ python_app__c.module | default('', true) or python_app__c.app }}"
python_app__package: "{{ python_app__c.package | default('', true) or (python_app__c.app | replace('_', '-')) }}"
python_app__socket: "/run/{{ python_app__unit }}/{{ python_app__unit }}.sock"
python_app__hardened: "{{ website_hardening_enabled | bool and python_app__c.hardening.enabled | bool }}"

# Group and mode of the environment file.
# The hook scripts of OpenVPN run as nobody:nogroup and read the file.
python_app__env_group: "{{ 'nogroup' if python_app__c.openvpn | length > 0 else python_app__group }}"
python_app__env_mode: "{{ '0640' if python_app__c.openvpn | length > 0 else '0600' }}"

# Value of the secret named by the loop item: the component entry of
# website_secrets, else the application entry when the component declares the
# name. Empty when the secret is not provided.
python_app__secret_value: >-
  {{ website_secrets[python_app__c.id][item]
     if (python_app__c.id in website_secrets and item in website_secrets[python_app__c.id])
     else (website_secrets[python_app__c.app][item]
           if (python_app__c.app in website_secrets and item in website_secrets[python_app__c.app]
               and item in (python_app__c.secret_names + python_app__c.optional_secret_names))
           else '') }}

# Names of the secrets the component declares or receives.
python_app__secret_names: >-
  {{ (python_app__c.secret_names + python_app__c.optional_secret_names
      + ((website_secrets[python_app__c.id] | default({})) | list)) | unique | list }}

# Web front of the component being deployed.
python_app__domain: "{{ python_app__c.nginx.domain | default('', true) or (website_hostnames[python_app__c.app] | default('')) }}"
python_app__tls: "{{ python_app__c.nginx.ssl in ['letsencrypt', 'step-ca'] }}"
python_app__wildcard: "{{ python_app__c.nginx.ssl_wildcard | bool }}"
python_app__cert_dir: "{{ website_letsencrypt_dir }}/live/{{ python_app__domain }}"
python_app__allowed_hosts: "{{ python_app__c.nginx.allowed_hosts if python_app__c.nginx.allowed_hosts | length > 0 else (website_internal_allowed_hosts if python_app__c.nginx.internal_domain | bool else []) }}"
python_app__upstream: >-
  {{ 'http://' ~ python_app__unit ~ '_upstream' if python_app__c.gunicorn.socket | bool
     else 'http://' ~ python_app__c.gunicorn.host ~ ':' ~ python_app__c.gunicorn.port }}
python_app__listen_addrs: >-
  {{ ([website_internal_listen, '127.0.0.1'] | unique | list)
     if python_app__c.nginx.internal_domain | bool
     else ([website_listen_ipv4 if website_listen_ipv4 | length > 0 else '0.0.0.0']
           + (['[' ~ website_listen_ipv6 ~ ']'] if website_listen_ipv6 | length > 0 else [])) }}
python_app__server_names: >-
  {{ [python_app__domain] + (python_app__c.nginx.ssl_wildcard_domains if python_app__wildcard else []) }}

# Privileged helper of custom_domain. The command table mirrors
# custom_domain.privileged_helper.COMMANDS: each command takes the options
# listed, in this order, then optionally one argument (a domain or a token).
python_app__helper_commands:
  - {name: write-config, options: [sites-dir, config-prefix, staging-dir], argument: true}
  - {name: remove-config, options: [sites-dir, config-prefix], argument: true}
  - {name: test-nginx, options: [nginx-bin], argument: false}
  - {name: reload-nginx, options: [systemctl-bin, nginx-service], argument: false}
  - {name: check-snippet, options: [nginx-bin, staging-dir], argument: true}
  - {name: certbot-issue, options: [certbot-bin, webroot, email], argument: true}
  - {name: certbot-renew, options: [certbot-bin], argument: true}
  - {name: certbot-revoke, options: [certbot-bin, letsencrypt-dir], argument: true}
  - {name: cert-dates, options: [openssl-bin, letsencrypt-dir], argument: true}

# Contact address of the certificate requests.
python_app__custom_domain_email: "{{ website_custom_domain_certbot_email | default('', true) or website_certbot_email }}"

# Value of each option of the helper (the settings of the service).
python_app__helper_options:
  sites-dir: "{{ website_custom_domain_sites_dir }}"
  config-prefix: "{{ website_custom_domain_config_prefix }}"
  staging-dir: "{{ website_custom_domain_staging_dir }}"
  nginx-bin: "{{ website_custom_domain_nginx_bin }}"
  nginx-service: "{{ website_custom_domain_nginx_service }}"
  systemctl-bin: "{{ website_custom_domain_systemctl_bin }}"
  certbot-bin: "{{ website_custom_domain_certbot_bin }}"
  openssl-bin: "{{ website_custom_domain_openssl_bin }}"
  webroot: "{{ website_custom_domain_webroot }}"
  letsencrypt-dir: "{{ website_custom_domain_letsencrypt_dir }}"
  email: "{{ python_app__custom_domain_email }}"

# Sudoers rules of the helper, without the user and the run-as part. This is
# the output of `custom-domain sudoers`: the helper and every option are part
# of the rule (sudo compares them literally) and only the trailing * varies.
# Characters that sudoers treats specially are escaped with a backslash.
python_app__helper_rules: >-
  {%- set ns = namespace(rules=[]) -%}
  {%- for command in python_app__helper_commands -%}
  {%- set words = namespace(list=[website_custom_domain_helper]) -%}
  {%- for option in command.options -%}
  {%- set words.list = words.list + ['--' ~ option, python_app__helper_options[option]] -%}
  {%- endfor -%}
  {%- set words.list = words.list + [command.name] -%}
  {%- set rule = words.list | map('regex_replace', '([ ,:=\\\\"#])', '\\\\\\1') | join(' ') -%}
  {%- set ns.rules = ns.rules + [rule ~ (' *' if command.argument else '')] -%}
  {%- endfor -%}
  {{ ns.rules }}

# Components that run with sudo: plain sudoers entries or the helper.
python_app__sudo: "{{ python_app__c.sudoers | length > 0 or python_app__c.custom_domain_helper.enabled | bool }}"
