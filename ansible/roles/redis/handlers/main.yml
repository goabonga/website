- name: Reload systemd for redis
  ansible.builtin.systemd:
    daemon_reload: true
  listen: redis | reload systemd

- name: Restart redis
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    state: restarted
  when: redis_service_state == 'started'
  listen: redis | restart
