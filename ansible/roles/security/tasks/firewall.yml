- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    cache_valid_time: 3600

- name: Allow the SSH port
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port | string }}"
    proto: tcp
  when: security_firewall_allow_ssh | bool

- name: Apply additional firewall rules
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ security_firewall_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Set the ufw logging level
  community.general.ufw:
    logging: "{{ security_firewall_logging }}"

- name: Set the default incoming policy
  community.general.ufw:
    default: "{{ security_firewall_default_incoming }}"
    direction: incoming

- name: Set the default outgoing policy
  community.general.ufw:
    default: "{{ security_firewall_default_outgoing }}"
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled
