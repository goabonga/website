- name: Create the CA group
  ansible.builtin.group:
    name: "{{ step_ca_group }}"
    system: true
    state: present

- name: Create the CA user
  ansible.builtin.user:
    name: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ step_ca_home }}"
    create_home: false
    state: present

- name: Create the CA directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ step_ca_home }}", mode: "0755" }
    - { path: "{{ step_ca_config_dir }}", mode: "0755" }
    - { path: "{{ step_ca_certs_dir }}", mode: "0755" }
    - { path: "{{ step_ca_secrets_dir }}", mode: "{{ step_ca_secrets_dir_mode }}" }
  loop_control:
    label: "{{ item.path }}"

# The keys of an initialised CA are encrypted with its password: replacing the password file
# with another one makes the CA unable to start. Check before writing.
- name: Look for the intermediate key of an existing CA
  ansible.builtin.stat:
    path: "{{ step_ca_secrets_dir }}/intermediate_ca_key"
  register: step_ca_intermediate_key_stat
  when: __step_ca_has_password | bool

- name: Check the password against the existing intermediate key
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ step_ca_secrets_dir }}/intermediate_ca_key"
      - -passin
      - stdin
      - -noout
    stdin: "{{ step_ca_password }}"
  register: step_ca_password_check
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - __step_ca_has_password | bool
    - step_ca_intermediate_key_stat.stat.exists

- name: Refuse a password that does not open the existing keys
  ansible.builtin.fail:
    msg: >-
      step_ca_password does not decrypt {{ step_ca_secrets_dir }}/intermediate_ca_key. The CA
      exists already and its keys are encrypted with its original password: writing this one
      would stop the CA from starting. Provide the original password.
  when:
    - __step_ca_has_password | bool
    - step_ca_intermediate_key_stat.stat.exists
    - step_ca_password_check.rc != 0

- name: Write the CA password file
  ansible.builtin.copy:
    content: "{{ step_ca_password }}"
    dest: "{{ step_ca_secrets_dir }}/password"
    owner: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    mode: "0600"
  no_log: true
  notify: step_ca | restart
  when: __step_ca_has_password | bool
