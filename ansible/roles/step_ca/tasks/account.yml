- name: Create the CA group
  ansible.builtin.group:
    name: "{{ step_ca_group }}"
    system: true
    state: present

- name: Create the CA user
  ansible.builtin.user:
    name: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ step_ca_home }}"
    create_home: false
    state: present

- name: Create the CA directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ step_ca_home }}", mode: "0755" }
    - { path: "{{ step_ca_config_dir }}", mode: "0755" }
    - { path: "{{ step_ca_certs_dir }}", mode: "0755" }
    - { path: "{{ step_ca_secrets_dir }}", mode: "{{ step_ca_secrets_dir_mode }}" }
  loop_control:
    label: "{{ item.path }}"

- name: Write the CA password file
  ansible.builtin.copy:
    content: "{{ step_ca_password }}"
    dest: "{{ step_ca_secrets_dir }}/password"
    owner: "{{ step_ca_user }}"
    group: "{{ step_ca_group }}"
    mode: "0600"
  no_log: true
  notify: step_ca | restart
  when: __step_ca_has_password | bool
