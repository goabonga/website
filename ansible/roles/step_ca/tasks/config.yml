- name: Apply the managed settings to ca.json
  when: step_ca_config_stat.stat.exists
  block:
    - name: Read ca.json
      ansible.builtin.slurp:
        src: "{{ step_ca_config_dir }}/ca.json"
      register: step_ca_config_raw
      no_log: "{{ step_ca_postgres_password | length > 0 }}"

    - name: Parse ca.json
      ansible.builtin.set_fact:
        step_ca_config_current: "{{ step_ca_config_raw.content | b64decode | from_json }}"
      no_log: "{{ step_ca_postgres_password | length > 0 }}"

    - name: Write ca.json when the managed settings differ
      ansible.builtin.copy:
        content: "{{ __step_ca_config_desired | to_nice_json(indent=2) }}\n"
        dest: "{{ step_ca_config_dir }}/ca.json"
        owner: "{{ step_ca_user }}"
        group: "{{ step_ca_group }}"
        mode: "0600"
      diff: false
      no_log: "{{ step_ca_postgres_password | length > 0 }}"
      notify: step_ca | restart
      when: step_ca_config_current != __step_ca_config_desired
