- name: Assert the target is a Debian-family system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: The step_ca role only supports Debian-family distributions.
    quiet: true

- name: Assert the VPN portal provisioner has a password
  ansible.builtin.assert:
    that: step_ca_vpn_portal_password | length > 0
    fail_msg: step_ca_vpn_portal_password is required when step_ca_vpn_portal_enabled is true.
    quiet: true
  when: step_ca_vpn_portal_enabled | bool

- name: Assert the user-defined provisioners are valid
  ansible.builtin.assert:
    that:
      - item.name is defined
      - (item.type | default('JWK')) in ['JWK', 'ACME']
      - (item.type | default('JWK')) != 'JWK' or (item.password | default('') | length > 0)
    fail_msg: Each step_ca_provisioners entry needs a name and, for JWK, a password.
    quiet: true
  loop: "{{ step_ca_provisioners }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Assert the ACME provisioner is available for the nginx proxy
  ansible.builtin.assert:
    that: step_ca_acme_enabled | bool
    fail_msg: step_ca_nginx_enabled obtains its certificate through ACME, so step_ca_acme_enabled must be true.
    quiet: true
  when: step_ca_nginx_enabled | bool
