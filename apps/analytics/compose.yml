services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_test
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_test"]
      interval: 2s
      timeout: 5s
      retries: 10
