[project]
name = "analytics"
version = "0.0.0"
description = "Privacy-friendly analytics service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "user-agents>=2.2.0",
    "geoip2>=4.8.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "src"
