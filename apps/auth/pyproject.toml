[project]
name = "auth"
version = "0.0.0"
description = "Centralized OIDC/OAuth2 authentication service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.0",
    "celery[redis]>=5.3.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "gunicorn>=21.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "mrml>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.1.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.7",
    "qrcode[pil]>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "uvicorn[standard]>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.behave]
paths = ["features"]
