{% extends "base.html" %}

{% block title %}Verify Email - Auth{% endblock %}

{% block content %}
<h1>Verify Your Email</h1>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

{% if success %}
<div class="success">{{ success }}</div>
{% endif %}

<form method="post" action="{{ tenant_prefix }}/auth/verify-email">
    <input type="hidden" name="next" value="{{ next|default('', true) }}">

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default('', true) }}" required>
    </div>

    <div class="form-group">
        <label for="code">Verification Code</label>
        <input type="text" id="code" name="code" required maxlength="6" pattern="[0-9]{6}" placeholder="000000" autocomplete="one-time-code">
    </div>

    <button type="submit">Verify Email</button>
</form>

<form method="post" action="{{ tenant_prefix }}/auth/resend-verification" style="margin-top: 1rem;">
    <input type="hidden" name="email" value="{{ email|default('', true) }}">
    <input type="hidden" name="next" value="{{ next|default('', true) }}">
    <p class="link">
        Didn't receive the code? <button type="submit" style="background: none; border: none; color: var(--primary-color); cursor: pointer; padding: 0; font-size: inherit;">Resend verification code</button>
    </p>
</form>

<p class="link">
    <a href="{{ tenant_prefix }}/auth/login{% if next %}?next={{ next|urlencode }}{% endif %}">Back to login</a>
</p>
{% endblock %}
