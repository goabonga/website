<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a2e;
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        .error-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #e94560;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-bottom: 1rem;
        }
        .error-message {
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-detail {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            color: #ff6b6b;
            word-break: break-word;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            margin: 0.25rem;
        }
        .btn-primary {
            background-color: #e94560;
            color: white;
        }
        .btn-primary:hover {
            background-color: #d63651;
        }
        .btn-secondary {
            background-color: #0f3460;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background-color: #1a4a7a;
        }
        .links {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">&#128274;</div>
        <div class="error-code">403</div>
        <h1 class="error-title">Access Denied</h1>
        <p class="error-message">
            You don't have permission to access this resource.
            Please contact your administrator if you believe this is an error.
        </p>
        {% if detail %}
        <div class="error-detail">{{ detail }}</div>
        {% endif %}
        <div class="links">
            <a href="/admin/" class="btn btn-primary">Go to Dashboard</a>
            <a href="/auth/settings" class="btn btn-secondary">Account Settings</a>
        </div>
    </div>
</body>
</html>
