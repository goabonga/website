services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fastapi_api_test
      POSTGRES_USER: fastapi_api
      POSTGRES_PASSWORD: fastapi_api
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_api -d fastapi_api_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
