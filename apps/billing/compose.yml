services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_test
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
