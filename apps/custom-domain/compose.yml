services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: custom_domain_test
      POSTGRES_USER: custom_domain
      POSTGRES_PASSWORD: custom_domain
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custom_domain -d custom_domain_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
