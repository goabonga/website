[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-domain"
version = "0.0.0"
description = "Centralized custom domain management with DNS verification and SSL provisioning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/custom_domain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.behave]
paths = ["features"]
