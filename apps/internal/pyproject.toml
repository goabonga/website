[project]
name = "internal"
version = "0.0.0"
description = "Internal admin dashboard for managing platform services."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "gunicorn>=21.2.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "mrml>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "pgvector>=0.2.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.behave]
paths = ["features"]
