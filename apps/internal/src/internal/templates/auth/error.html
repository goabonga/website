<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Error - Internal Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a2e;
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            color: #e94560;
            margin-bottom: 1rem;
        }
        .error-code {
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: #a0a0a0;
            background-color: #16213e;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .error-description {
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #d63651;
        }
        .btn-secondary {
            background-color: #0f3460;
            margin-left: 0.5rem;
        }
        .btn-secondary:hover {
            background-color: #1a4a7a;
        }
        .links {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">&#128274;</div>
        <h1 class="error-title">Authentication Error</h1>
        <div class="error-code">{{ error }}</div>
        <p class="error-description">{{ error_description }}</p>
        <div class="links">
            <a href="/auth/login" class="btn">Try Again</a>
            <a href="/" class="btn btn-secondary">Go Home</a>
        </div>
    </div>
</body>
</html>
