<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Knowledge</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .header-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .header-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .header-nav a:hover {
            color: var(--text-primary);
        }

        /* Main content */
        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            gap: 24px;
        }

        .tab {
            padding: 12px 0;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-blue);
        }

        /* Card */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-group .help-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.875rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            transition: border-color 0.15s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .form-control:disabled {
            background-color: var(--bg-dark);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: #4c9aed;
        }

        .btn-secondary {
            background-color: var(--bg-input);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            background-color: #d73a49;
        }

        .btn-success {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .alert-error {
            background-color: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: var(--accent-red);
        }

        .alert-success {
            background-color: rgba(63, 185, 80, 0.15);
            border: 1px solid rgba(63, 185, 80, 0.3);
            color: var(--accent-green);
        }

        .alert-warning {
            background-color: rgba(210, 153, 34, 0.15);
            border: 1px solid rgba(210, 153, 34, 0.3);
            color: var(--accent-yellow);
        }

        /* MFA */
        .mfa-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: var(--bg-input);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .mfa-status .icon {
            font-size: 1.5rem;
        }

        .mfa-status .status-text {
            flex: 1;
        }

        .mfa-status .status-text strong {
            display: block;
            margin-bottom: 4px;
        }

        .mfa-status .status-text span {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 12px;
        }

        .badge-success {
            background-color: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .badge-warning {
            background-color: rgba(210, 153, 34, 0.2);
            color: var(--accent-yellow);
        }

        /* QR Code */
        .qr-container {
            text-align: center;
            padding: 24px;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .qr-container img {
            max-width: 200px;
            height: auto;
        }

        .secret-code {
            font-family: monospace;
            font-size: 1rem;
            padding: 12px;
            background-color: var(--bg-input);
            border-radius: 6px;
            letter-spacing: 2px;
            text-align: center;
            word-break: break-all;
        }

        /* Backup codes */
        .backup-codes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .backup-code {
            font-family: monospace;
            font-size: 0.875rem;
            padding: 8px 12px;
            background-color: var(--bg-input);
            border-radius: 4px;
            text-align: center;
        }

        /* Hidden sections */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Knowledge<span>.</span></a>
        <nav class="header-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/auth/logout">Sign out</a>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1>Account Settings</h1>
            <p>Manage your profile and security settings</p>
        </div>

        <div class="tabs">
            <a href="/auth/account" class="tab {% if active_tab == 'profile' %}active{% endif %}">Profile</a>
            <a href="/auth/account/security" class="tab {% if active_tab == 'security' %}active{% endif %}">Security</a>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
