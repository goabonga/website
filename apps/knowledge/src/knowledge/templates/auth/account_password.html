{% extends "auth/account_base.html" %}

{% block account_content %}
<div class="account-card">
    <div class="account-card-header">
        <h2>Change Password</h2>
    </div>

    <form method="post" action="/auth/account/password">
        <div class="account-form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" class="form-control" required>
        </div>

        <div class="account-form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8">
            <ul id="password-requirements" class="password-requirements" style="margin-top: 8px; padding-left: 20px;">
                <li id="req-length">At least 8 characters</li>
                <li id="req-uppercase">At least one uppercase letter</li>
                <li id="req-lowercase">At least one lowercase letter</li>
                <li id="req-digit">At least one digit</li>
            </ul>
        </div>

        <div class="account-form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const form = document.querySelector('form');

    const requirements = {
        length: { element: document.getElementById('req-length'), regex: /.{8,}/ },
        uppercase: { element: document.getElementById('req-uppercase'), regex: /[A-Z]/ },
        lowercase: { element: document.getElementById('req-lowercase'), regex: /[a-z]/ },
        digit: { element: document.getElementById('req-digit'), regex: /\d/ }
    };

    function validatePassword() {
        const password = passwordInput.value;
        let allValid = true;

        for (const [key, req] of Object.entries(requirements)) {
            const isValid = req.regex.test(password);
            req.element.classList.toggle('valid', isValid);
            req.element.classList.toggle('invalid', !isValid && password.length > 0);
            if (!isValid) allValid = false;
        }

        return allValid;
    }

    passwordInput.addEventListener('input', validatePassword);

    form.addEventListener('submit', function(e) {
        if (!validatePassword()) {
            e.preventDefault();
            alert('Password does not meet all requirements.');
            return false;
        }

        if (passwordInput.value !== confirmInput.value) {
            e.preventDefault();
            alert('Passwords do not match.');
            return false;
        }
    });
});
</script>
{% endblock %}
