[project]
name = "mailler"
version = "0.0.0"
description = "Internal email sending service with multi-provider support, campaigns and inbound processing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "boto3>=1.34.0",
    "email-validator>=2.1.0",
    "celery[redis]>=5.3.0",
    "alembic>=1.13.0",
    "mrml>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "html2text>=2024.2.26",
]

[project.scripts]
mailler = "mailler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.behave]
paths = ["features"]
