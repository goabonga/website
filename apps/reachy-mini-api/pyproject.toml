[project]
name = "reachy-mini-api"
version = "0.0.0"
description = "Internal API for the Reachy Mini robot: reports, status and a WebSocket channel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.1.0",
    "uvicorn[standard]>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_mini_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
