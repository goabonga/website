[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team"
version = "0.0.0"
description = "Multi-agent orchestration platform: AI agents, workflows, tasks and memory behind a REST API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "PyJWT[crypto]>=2.8.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/team"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
