services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpn_portal_test
      POSTGRES_USER: vpn_portal
      POSTGRES_PASSWORD: vpn_portal
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_portal -d vpn_portal_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
