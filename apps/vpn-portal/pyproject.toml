[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-portal"
version = "0.0.0"
description = "Zero-Trust VPN authentication and certificate issuance service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "pydantic-settings>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_portal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.behave]
paths = ["features"]
