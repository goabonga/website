[defaults]
inventory = inventory/hosts.yml
# Installed from this repository by the deploy workflows:
#   ansible-galaxy collection install ../../ansible -p ../../collections
collections_path = ../../collections
host_key_checking = True
interpreter_python = auto_silent
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
