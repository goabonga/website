---
# The host and the account come from the environment so that no address is
# committed. The deploy workflows take them from the variables DEPLOY_HOST and
# DEPLOY_USER of the GitHub Environment.
all:
  children:
    website:
      hosts:
        production:
          ansible_host: "{{ lookup('ansible.builtin.env', 'DEPLOY_HOST') }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'DEPLOY_USER') | default('deploy', true) }}"
