[project]
name = "e2e-support"
version = "0.0.0"
description = "Support library to run behave scenarios in a real browser with Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: the test drives a real browser through Playwright"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
