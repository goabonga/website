# multicz.toml - versioning, changelog and tagging driven by Conventional
# Commits. Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.mta-sts]
tag_format = "mta-sts-v{version}"
paths = [
    "apps/mta-sts/src/**",
    "apps/mta-sts/features/**",
    "apps/mta-sts/tests/**",
    "apps/mta-sts/pyproject.toml",
]
bump_files = [
    { file = "apps/mta-sts/pyproject.toml", key = "project.version" },
    { file = "apps/mta-sts/src/mta_sts/__init__.py", key = "regex:__version__\\s*=\\s*[\"']([^\"']+)[\"']" },
    { file = "README.md", key = 'regex:<!-- v:mta-sts -->([^<]*)<!-- /v -->' },
]
changelog = "apps/mta-sts/CHANGELOG.md"
post_bump = ["uv lock"]

