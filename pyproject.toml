[project]
name = "website"
version = "0.0.0"
description = "Monorepo of the platform services and the Ansible collection that deploys them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[tool.uv.sources]
e2e-support = { workspace = true }

[dependency-groups]
dev = [
    "e2e-support",
    "playwright>=1.49",
    "ruff>=0.13",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "behave>=1.2.6",
    "aiosqlite>=0.22.1",
    "ansible-core>=2.16",
]
doc = [
    "zensical",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ansible", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
